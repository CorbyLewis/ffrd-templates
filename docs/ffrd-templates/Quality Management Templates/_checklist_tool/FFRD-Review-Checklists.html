  "sections": [
   {
    "id": "MET-S01",
    "title": "Transposition Region",
    "items": [
     {
      "id": "MET-001",
      "text": "Is the Transposition Region selected meteorologically homogeneous?"
     },
     {
      "id": "MET-002",
      "text": "Is the transposition domain polygon in the correct projection? Is it a complete, closed polygon with no holes?"
     },
     {
      "id": "MET-003",
      "text": "Is the watershed polygon completely inside the transposition domain polygon?"
     },
     {
      "id": "MET-004",
      "text": "Is the transposition domain at least 5 times larger than the watershed by area?"
     },
     {
      "id": "MET-005",
      "text": "Were storm and flood reports for the region investigated to determine the flood-causing meteorological mechanisms?"
     },
     {
      "id": "MET-006",
      "text": "Was the transposition domain compared to IBTrACS storm tracks to screen for tropical cyclone activity?"
     }
    ]
   },
   {
    "id": "MET-S02",
    "title": "Storm Catalog",
    "items": [
     {
      "id": "MET-007",
      "text": "Were the storms taken only from complete years in the precipitation data period of record? Were they taken from all the complete years in the period of record?"
     },
     {
      "id": "MET-008",
      "text": "Are all storms the correct duration per SOP?"
     },
     {
      "id": "MET-009",
      "text": "Does the catalog contain the correct number and rankings of storm events?"
     },
     {
      "id": "MET-010",
      "text": "Are the date ranges for all storm events non-overlapping?"
     },
     {
      "id": "MET-011",
      "text": "Do the names of the precipitation grid sets in the HMS .grid file follow the SOP standard naming convention? Do the DSS files follow the naming convention? Does the entry in the HMS .grid file point to the correct DSS file and path?"
     },
     {
      "id": "MET-012",
      "text": "Is all the precipitation, snow-water equivalent and temperature grid data in the correct projection as specified in the DSS path A-part?"
     },
     {
      "id": "MET-013",
      "text": "Are the storm center coordinates in the HMS .grid file in the correct projection and units? Are they all specified (no blanks, no zeroes)?"
     },
     {
      "id": "MET-014",
      "text": "Are all storm center coordinates inside the transposition domain polygon?"
     },
     {
      "id": "MET-015",
      "text": "Does each storm event DSS file also contain temperature data? Do the dates for the gridded temperature data line up with the dates of the precipitation data?"
     },
     {
      "id": "MET-016",
      "text": "Was storm typing completed for each event? Was the storm type included in the DSS file and entries in the HMS .grid file?"
     },
     {
      "id": "MET-017",
      "text": "Was an automated storm classifier used? Was the performance of the automated classifier satisfactory? Was automated classification applied to each storm in the catalog?"
     },
     {
      "id": "MET-018",
      "text": "Was a seasonality analysis for each storm type completed? Do the daily probabilities of selection for each storm type add up to 1?"
     }
    ]
   },
   {
    "id": "MET-S03",
    "title": "Normalization Field",
    "items": [
     {
      "id": "MET-019",
      "text": "What was the source of the normalization field? Is the quality deemed acceptable?"
     },
     {
      "id": "MET-020",
      "text": "Does the normalization field completely cover the extents of the transposition domain with no missing values?"
     },
     {
      "id": "MET-021",
      "text": "If a mean annual maximum grid was generated, is its spatial pattern consistent with PRISM?"
     }
    ]
   },
   {
    "id": "MET-S04",
    "title": "Meteorological Reporting",
    "items": [
     {
      "id": "MET-022",
      "text": "Are the methods and assumptions used for selection of the transposition region adequately documented in the Scoping and Data Preparation Phase Report?"
     },
     {
      "id": "MET-023",
      "text": "Is the storm catalog development including assignment of storm types and seasonality adequately documented in the Scoping and Data Preparation Phase Report?"
     },
     {
      "id": "MET-024",
      "text": "Is the development of the normalization grid adequately documented in the Scoping and Data Preparation Phase Report?"
     },
     {
      "id": "MET-025",
      "text": "Is the SST Upper Limit for rainfall and flood frequency analysis clearly documented in the report?"
     }
    ]
   }

    "items": [

      "text": "Although naming conventions of individual models and internal model elements are strictly enforced during Model Calibration Phase, a Pre-conformance check is needed to ensure naming conventions align across the basin and across all models. These names should align with those laid out in the pre-model data preparation tables.\nAre the naming conventions fully aligned with the SOP?"

    "items": [

      "id": "PCF-009",
      "text": "Has the 'Hydraulic Review Checklist' been completed and all review comments closed out prior to start of conformance phase?"

      "id": "PCF-010",
      "text": "Have all unnecessary files been removed from the HMS project directory?"

      "text": "Were extraneous model components (basin models, meteorologic models, control specifications, etc.) removed from the final HMS project?"

      "id": "PCF-012",
      "text": "For the HMS project, has a new Meteorologic Model been created for use within the conformance and production phases?"
     },
     {
      "id": "PCF-013",
      "text": "For the HMS project, has a new SST-specific Control Specification been created for use within the conformance and production phases?"
     },
     {
      "id": "PCF-014",
      "text": "For the HMS project, has a new SST-specific Simulation Run been created for use within the conformance and production phases?"
     },
     {
      "id": "PCF-015",
      "text": "For each reservoir in the HMS project, has the routing method been changed to utilize something other than Specified Release? The Specified Release method should not be used for any simulations within the conformance or production phases."
     },
     {
      "id": "PCF-016",
      "text": "For the HMS Project, were the POR outputs converted to daily average time series for use in initial conditions sampling? Were all missing values within the POR results estimated? Were all negative values within the POR results corrected?"
     },
     {
      "id": "PCF-017",
      "text": "For each subbasin in the HMS project, is the sampled initial canopy storage less than or equal to the maximum canopy storage for all .basin files?"
     },
     {
      "id": "PCF-018",
      "text": "For each reach w/in the HMS project, is the sampled initial discharge greater than zero for all .basin files?"
     },
     {
      "id": "PCF-019",
      "text": "For each reach w/in the HMS project that utilizes the Mod Puls method, is the sampled initial discharge within the range of values for the associated storage-discharge paired data objects for all .basin files?"
     },
     {
      "id": "PCF-020",
      "text": "For each reservoir in the HMS project, is the sampled initial reservoir elevation within the range of values for the associated elevation-storage paired data objects for all .basin files?"
     },
     {
      "id": "PCF-021",
      "text": "Do all models follow standard naming conventions for filenames and elements?"
     }
    ]
   },
   {
    "id": "PCF-S05",
    "title": "Hydraulic Model Stability & Runtimes",
    "items": [
     {
      "id": "PCF-022",
      "text": "Have the hydraulic model runtimes been checked for reasonableness? Have models with excessive run-times been evaluated for possible improvements to geometry or other run configurations?"
     },
     {
      "id": "PCF-023",
      "text": "Were the 2D matrix solvers tested to optimize computational runtime and model stability? Is the selection of the matrix solver and parameters documented in the calibration report? These solvers may result in significant computational savings during stochastic cloud simulation."
     },
     {
      "id": "PCF-024",
      "text": "Have hydraulic model results been checked for issues indicating model instability? Can these instabilities be addressed/improved?"
     },
     {
      "id": "PCF-025",
      "text": "Has stress testing been performed on the hydraulic model? Including breach simulations and levee overtopping. Were the results of these stress tests acceptable?"
     }
    ]
   },
   {
    "id": "PCF-S06",
    "title": "Hydraulic Model Preparation for Cloud Compute",
    "items": [
     {
      "id": "PCF-026",
      "text": "Was the model delivered with a single plan, flow and geometry file? Were all extraneous files from the model removed?"
     },
     {
      "id": "PCF-027",
      "text": "Were all breaches included in the RAS run as intended? Were these breaches enabled?"
     },
     {
      "id": "PCF-028",
      "text": "Was the number of cores setting reviewed and optimized for cloud compute?"
     },
     {
      "id": "PCF-029",
      "text": "Have all inflow or other boundary condition table dimensions in the HDF file been verified? (i.e. Do they match the dimensions consistent with the desired time window for the SST synthetic events?)"
     },
     {
      "id": "PCF-030",
      "text": "Has the RAS list of cells impacted by initial conditions points (IC point cells) associated with reservoirs been posted to the 'conformance/hydraulics/[model-unit-name]' directory? Is it named and formatted appropriately?"
     },
     {
      "id": "PCF-031",
      "text": "When creating the high reservoir pool plan needed to generate the IC point cells, were the results verified to ensure no 'leaky' reservoirs?"
     },
     {
      "id": "PCF-032",
      "text": "Was the HEC-RAS model description updated (such as 'date last modified' and 'status of model')?"
     },
     {
      "id": "PCF-033",
      "text": "Have all references to observed data been removed from the model? Note that references to published stage-discharge rating curves can remain in the model if associated with a reference line."
     },
     {
      "id": "PCF-034",
      "text": "Have reservoir releases been appropriately modeled? Have these releases been coordinated across other models (i.e. ResSim and HMS)? Special care is required to avoid double counting for outflow when a structure has multiple means of discharging water."
     },
     {
      "id": "PCF-035",
      "text": "For dam structures where releases are defined by ResSim, was the dam embankment raised to prevent double accounting of overtopping and spillway flows? These flows should be accounted for in the ResSim releases and coordination between models may be required."
     },
     {
      "id": "PCF-036",
      "text": "Has breaching been set up appropriately for all structures? Verify breach parameters, triggers, and locations. Breach invert elevations should not be below minimum terrain elevations for adjacent 2D cells."
     },
     {
      "id": "PCF-037",
      "text": "Are file naming conventions followed? Have the names been adjusted for generalized SST events?"
     },
     {
      "id": "PCF-038",
      "text": "Are all output intervals set consistently for all RAS model units in the basin?"
     },
     {
      "id": "PCF-039",
      "text": "Are time windows for all RAS model units set consistently in the basin?"
     },
     {
      "id": "PCF-040",
      "text": "Are any additional output options enabled to be written with results? These would be selected in the \"Plan > Options > Output Options …\" window. Enabling these options can be useful for troubleshooting model issues, but can result in significantly increased file sizes and these should be disabled prior to the conformance phase of hydraulic model simulation."
     }
    ]
   },
   {
    "id": "PCF-S07",
    "title": "Model Linking Register and Naming Table",
    "items": [
     {
      "id": "PCF-041",
      "text": "Has the table of model linkages for the whole system of models for a generalized synthetic event been provided? Is it accurate?"
     },
     {
      "id": "PCF-042",
      "text": "Has the accuracy of linkages in cloud compute been confirmed by producing an exact replica of the cloud compute results through a desktop run of the same event?"
     },
     {
      "id": "PCF-043",
      "text": "A Directed Acyclic Graph (DAG) is a flow chart that clearly indicates which models rely on output from other models being available (e.g. Upstream RAS model must complete before Downstream RAS model can start).\nHas the directed acyclic graph been provided? Is it accurate? Ensure that model units with multiple inflows and/or outflows to other model units are captured in the DAG."
     }
    ]
   },
   {
    "id": "PCF-S08",
    "title": "Breaches",
    "items": [
     {
      "id": "PCF-044",
      "text": "Have the breach SRP tables been delivered in the appropriate format and directory location? Have all naming conventions in the SRP table headers been reviewed for SOP consistency? Do all names match RAS structure names?"
     }
    ]
   },
   {
    "id": "PCF-S09",
    "title": "Sampling Strategies and Antecedent Conditions",
    "items": [
     {
      "id": "PCF-045",
      "text": "Were POR and calibration event sets converted to antecedent conditions data?"
     },
     {
      "id": "PCF-046",
      "text": "Have the antecedent condition input files for cloud compute been delivered (HMS basin files)? Do they match the required format and naming conventions?"
     },
     {
      "id": "PCF-047",
      "text": "Are the sampling strategies for stochastic simulations well defined and documented in the draft report? e.g.: Initial dam elevations, hydrologic parameters, hydrologic initial conditions, etc."
     }
    ]
   },
   {
    "id": "PCF-S10",
    "title": "Cloud Compute Fidelity Check",
    "items": [
     {
      "id": "PCF-048",
      "text": "Can an exact replica of the cloud compute results be recreated with desktop run of the same event? (full system - HMS, ResSim, RAS, Maps)"
     }
    ]
   },
   {
    "id": "PCF-S11",
    "title": "Pre-Conformance - Coverage",
    "items": [
     {
      "id": "PCF-049",
      "text": "Does the combined extent of all RAS models cover the entire study area? Are overlapping areas easily understood and appropriate?"
     }
    ]
   },
   {
    "id": "PCF-S12",
    "title": "Levee Data",
    "items": [
     {
      "id": "PCF-050",
      "text": "Are levee breaches located in the correct locations?"
     },
     {
      "id": "PCF-051",
      "text": "Are all levee system response curve files in the Model Library for sampling? Do the system response curve breach location names match the 2D RAS connection names?"
     },
     {
      "id": "PCF-052",
      "text": "Are the SRP tables delivered in the appropriate format and location ('conformance/system response')?"
     }
    ]
   },
   {
    "id": "PCF-S13",
    "title": "Reservoir Operations",
    "items": [
     {
      "id": "PCF-053",
      "text": "Has the element naming convention been followed?"
     },
     {
      "id": "PCF-054",
      "text": "Does the watershed.md file include all relevant notes related to ResSim model development?"
     },
     {
      "id": "PCF-055",
      "text": "Has the ResSim model been prepared for cloud compute per the guidance in Job Aid 12?"
     },
     {
      "id": "PCF-056",
      "text": "Have all alternatives, except the 'fema_ffrd' alternative been removed from the project?"
     },
     {
      "id": "PCF-057",
      "text": "Have all unnecessary outputs been turned off in the 'fema_ffrd' alternative?"
     }
    ]
   },
   {
    "id": "PCF-S14",
    "title": "HMS Delivery",
    "items": [
     {
      "id": "PCF-058",
      "text": "Were all combinations of initial states and hydrologic parameter sets provided in the location defined by SOP?"
     }
    ]
   }
  ]

   {
    "id": "PRD-S01",
    "title": "Comparison of Production-Level Model Results to Observed Data",
    "items": [
     {
      "id": "PRD-001",
      "text": "Is the fit between modeled vs observed frequency curves acceptable? For stage, flow, and precipitation."
     },
     {
      "id": "PRD-002",
      "text": "Is the fit of modeled vs observed stage-discharge rating curves acceptable?"
     },
     {
      "id": "PRD-003",
      "text": "Are deviations between modeled and observed understood and documented? Are deviations expected based on results from the Conformance Phase?"
     },
     {
      "id": "PRD-004",
      "text": "Are model stability metrics acceptable (e.g. number of unstable/failed simulations, volume accounting error, etc.)?"
     }
    ]
   },
   {
    "id": "PRD-S02",
    "title": "Evaluation of Uncertainty",
    "items": [
     {
      "id": "PRD-005",
      "text": "Is uncertainty in model results quantified? Does the spread of uncertainty meet expectations?"
     },
     {
      "id": "PRD-006",
      "text": "Is the uncertainty in model results reasonable within the FFRD modeling framework? Does it provide a valuable product to inform and communicate flood risk?"
     },
     {
      "id": "PRD-007",
      "text": "Does dam and levee breaching perform as expected? Are breaches triggered according to the system response probability curves? Do modeled SRP curves match input SRP curves?"
     }
    ]
   },
   {
    "id": "PRD-S03",
    "title": "Documentation of Required Hotfixes during Production Runs",
    "items": [
     {
      "id": "PRD-008",
      "text": "Were any changes to modeling or stochastic processes performed following the Conformance Phase of modeling?"
     },
     {
      "id": "PRD-009",
      "text": "Did any hotfixes which were implemented result in the anticipated effect? Were the issues of concern addressed successfully with the hotfix?"
     }
    ]
   },
   {
    "id": "PRD-S04",
    "title": "Output Mapping Results QC Items",
    "items": [
     {
      "id": "PRD-010",
      "text": "Do mapped output results provide complete coverage over the study area?"
     },
     {
      "id": "PRD-011",
      "text": "Are mapped outputs at the correct spatial resolution?"
     },
     {
      "id": "PRD-012",
      "text": "Are mapped outputs intuitive? For example, does hazard mapping follow floodplain trends? Are structures such as levees and dams breakpoints in hazard regions?"
     },
     {
      "id": "PRD-013",
      "text": "Are both pluvial and fluvial hazards included in mapping?"
     },
     {
      "id": "PRD-014",
      "text": "Have comparisons been made to existing hazard data sources? Do these comparisons indicate any potential issues with FFRD results?"
     }
    ]
   },
   {
    "id": "PRD-S05",
    "title": "Consequences Results Items",
    "items": [
     {
      "id": "PRD-015",
      "text": "Have consequence results been generated? Do they meet the requirements of the FFRD study?"
     }
    ]
   },
   {
    "id": "PRD-S06",
    "title": "Close-out: Documentation and Delivery of Final Data",
    "items": [
     {
      "id": "PRD-016",
      "text": "Has all documentation been completed? Including all phases of model development? Have unique issues and limitations been documented?"
     },
     {
      "id": "PRD-017",
      "text": "Has finalized data been uploaded and archived to the appropriate storage location?"
     }
    ]
   }

  "sections": [
   {
    "id": "RES-S01",
    "title": "General",
    "items": [
     {
      "id": "RES-001",
      "text": "What version of ResSim was used to run the model? Does it match the version called out in the Project Work Plan (BE-PWP)?"
     },
     {
      "id": "RES-002",
      "text": "Was the ResSim model developed using the FFRD projection as stated in SOP?"
     },
     {
      "id": "RES-003",
      "text": "Was the ResSim model set up for GMT?"
     },
     {
      "id": "RES-004",
      "text": "Was the team/district approved stream alignment (RAS centerline) used to develop the watershed schematic?"
     },
     {
      "id": "RES-005",
      "text": "Does the watershed model cover the full extent of the basin for all models and data acquisition sites?"
     },
     {
      "id": "RES-006",
      "text": "Were common computation points defined at all reservoirs, stream gages, control points, and any other locations where data is transferred from one model to another?"
     },
     {
      "id": "RES-007",
      "text": "Are the common computation point names identical to the corresponding elements in the HMS model?"
     },
     {
      "id": "RES-008",
      "text": "Are the Reservoir Network elements (reservoirs, junctions, diversions, routing reaches, etc.) names identical to the corresponding elements in the HMS model?"
     },
     {
      "id": "RES-009",
      "text": "Does the reservoir network module include appropriate input data such as storage curves and rating curves from water control manuals or other published sources?"
     },
     {
      "id": "RES-010",
      "text": "Is the elevation data within the MMC standard vertical datum (NAVD 88)?"
     },
     {
      "id": "RES-011",
      "text": "Was a \"Conservation of Mass\" alternative created and has conservation of mass been verified?"
     },
     {
      "id": "RES-012",
      "text": "Was a \"Historic Data\" alternative created?"
     },
     {
      "id": "RES-013",
      "text": "Were the \"Historic Data\" alternative's inflows mapped to the correct outputs from the HMS model?"
     },
     {
      "id": "RES-014",
      "text": "Does the \"Historic Data\" alternative run without error and produce reasonable results?"
     },
     {
      "id": "RES-015",
      "text": "Have rules been set up for every operations set necessary?"
     },
     {
      "id": "RES-016",
      "text": "Has a period of record compute been set up and run successfully?"
     },
     {
      "id": "RES-017",
      "text": "Do real-time operation rules adequately reproduce historic data at the reservoir and downstream locations? (Historical data will likely not be reproduced exactly due to several factors, but the results should be reasonable and make sense for the system.)"
     },
     {
      "id": "RES-018",
      "text": "Has the model been set up for dam breach and run of river operations? Has this functionality been tested in the context of the model system?"
     },
     {
      "id": "RES-019",
      "text": "Has a Water Control Manual scenario been set up and successfully run?"
     },
     {
      "id": "RES-020",
      "text": "Has an Extreme Events scenario been set up and can it model events like a PMF or SDF?"
     },
     {
      "id": "RES-021",
      "text": "Does the tabular data (storage curves, discharge curves) extend to the top of dam or design flood elevation (whichever is higher)?",
      "sourceNotes": [
       "Comment:\n    They should be extended to handle the the most extreme flood reasonable possible in SST events. In some cases it could be higher than Design flood or top of dam. When in doubt - add to the height.\nReply:\n    Add phrase to check that all overtopping is accounted for in extreme events in terms of discharge curves."
      ]
     },
     {
      "id": "RES-022",
      "text": "Does the Elevation-Storage relationship for each reservoir match the best available information? Was any vertical datum adjustment made? Was the Elevation-Storage relationship used in ResSim verified for consistency with HMS and RAS models?"
     },
     {
      "id": "RES-023",
      "text": "Have the final routing parameters from the calibrated HMS model been included in the final ResSim networks? (The routing in HMS and ResSim should match where the models overlap.)"
     },
     {
      "id": "RES-024",
      "text": "Was the model cleaned up before being handed off? Were extraneous DSS files, networks, alternatives, and simulations removed? Only the FFRD alternative and network should be left in the model. Test data and simulations should be cleaned out, and the minimum required to run the model should be delivered for FFRD integration. Delivered model should also reduce the DSS files written by unchecking unnecessary datasets in the DSS Output tab."
     },
     {
      "id": "RES-025",
      "text": "Were the simulation and alternative to be used in the FFRD compute clearly named to be easily identifiable?"
     },
     {
      "id": "RES-026",
      "text": "Was documentation of the 100% milestone provided to the reviewer?"
     },
     {
      "id": "RES-027",
      "text": "Does the watershed.md file include all relevant notes related to ResSim model development?"
     },
     {
      "id": "RES-028",
      "text": "Does the treatment of overtopping of each unique outflow location account for hypothetical extreme events that may cause overtopping? Is free overflow allowed? If so, is it consistent with outflow that would be computed by a hydraulic model based on the crest profile?"
     },
     {
      "id": "RES-029",
      "text": "Has coordination with the hydraulic modelers been performed to ensure dam structures are appropriately represented in both models (HEC-RAS and HEC-ResSim)? This includes ensuring that all outflow from each project is appropriately represented and no double-accounting of flow is occurring. If dam outlets discharge into significantly different locations (such as a spillway discharging into a different consequence area from a low-level outlet), have these nuances been coordinated between RAS and ResSim models?"
     }
    ]
   }
  ]

<script>
"use strict";
/* ================================ Catalog & constants ================================ */
const TEMPLATES = (window.FFRD_TEMPLATES || []).slice();
const PHASES = (window.FFRD_PHASES || []).slice().sort((a, b) => a.number - b.number);
const TPL = Object.fromEntries(TEMPLATES.map(t => [t.id, t]));
const PHASE = Object.fromEntries(PHASES.map(p => [p.id, p]));
// A project folder holds _ffrd-basin-review-project.json (the project file; the leading "_" keeps it at the top of
// file listings) and its checklist files (*.review.json) side by side. Projects made by earlier versions
// used ffrd-project.json (and briefly _ffrd-basin-review-documentation.json); those names are still recognised and kept (P.manifestFile) so no second file appears.
// Projects made by earlier versions kept checklists in a checklists/ subfolder; those are still found
// and saved back where they are (R.path), while new checklists go in the project folder itself.
const MANIFEST = "_ffrd-basin-review-project.json", LEGACY_MANIFESTS = ["ffrd-project.json", "_ffrd-basin-review-documentation.json"], LEGACY_CHK_DIR = "checklists";
/** Name of the project file in a folder (current name first, then the older one), or null if it has none. */
async function manifestNameIn(dir) {
  for (const n of [MANIFEST, ...LEGACY_MANIFESTS]) { try { await fileAt(dir, n); return n; } catch { /* try the next name */ } }
  return null;
}
const LS_PREFS = "ffrd-prefs", LS_DRAFT = "ffrd-draft:";
const hasFSA = "showDirectoryPicker" in window;
const STATUS_CHIPS = {
  reviewer: ["Initial review in progress", "Review comments sent to modeler", "Backcheck in progress", "Backcheck complete; all items closed"],
  modeler: ["Pre-review comments entered", "Responding to reviewer comments", "Responses complete; ready for backcheck"],
};
const qcTemplates = phaseId => TEMPLATES.filter(t => t.reviewType !== "QA" && t.phase === phaseId).sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
const masterTemplate = TEMPLATES.find(t => t.reviewType === "QA");

/* ================================ State ================================ */
// project = { dir, manifest, reviews: Map<fileName, R>, drafts: [], errors: [] }
// R = { file, path (relative to the project folder), doc, lastModified, dirty, savedLogLen }
const state = { project: null, view: "home", current: null };
let doc = null; // the review currently open (state.project.reviews.get(state.current).doc)
const prefs = loadJSON(LS_PREFS) || { name: "", role: "modeler" };
const ui = { q: "", status: "all", expanded: new Set(), expandAll: false, lastItem: null, collapsed: new Set(prefs.tocCollapsed || []) };
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");

/* ================================ Utilities ================================ */
function loadJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function saveLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function nowISO() { return new Date().toISOString(); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2800); }
function fmtTime(v) { try { return new Date(v).toLocaleString(); } catch { return String(v); } }
function fmtDate(v) { try { return new Date(v).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); } catch { return String(v); } }
function slug(s) { return String(s).toLowerCase().normalize("NFKD").replace(/[^\w]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "unit"; }
function stamp() { return new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z"); }
function rand4() { return Math.random().toString(36).slice(2, 6); }
function plural(n, w) { return `${n} ${w}${n === 1 ? "" : "s"}`; }
function phaseLabel(id) { const p = PHASE[id]; return p ? `Phase ${p.number}: ${p.title}` : "Other"; }
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ================================ File system (File System Access API) ================================ */
async function dirAt(root, parts, create = false) { let d = root; for (const p of parts) if (p) d = await d.getDirectoryHandle(p, { create }); return d; }
async function fileAt(root, path, create = false) { const parts = path.split("/"); const name = parts.pop(); return (await dirAt(root, parts, create)).getFileHandle(name, { create }); }
async function writeAt(root, path, data) { const fh = await fileAt(root, path, true); const w = await fh.createWritable(); await w.write(data); await w.close(); return fh; }
async function readAt(root, path) { const f = await (await fileAt(root, path)).getFile(); return { text: await f.text(), lastModified: f.lastModified, file: f }; }
async function ensurePermission(h) {
  const opts = { mode: "readwrite" };
  if (!h.queryPermission) return true;
  if ((await h.queryPermission(opts)) === "granted") return true;
  return (await h.requestPermission(opts)) === "granted";
}

/* Recent projects (directory handles persist in IndexedDB) */
function idb() { return new Promise((res, rej) => { const r = indexedDB.open("ffrd-checklists", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function idbDel(k) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function idbPrefix(pre) {
  const db = await idb();
  return new Promise((res, rej) => {
    const out = [], q = db.transaction("kv").objectStore("kv").openCursor(IDBKeyRange.bound(pre, pre + "￿"));
    q.onsuccess = () => { const c = q.result; if (!c) return res(out); out.push([c.key, c.value]); c.continue(); };
    q.onerror = () => rej(q.error);
  });
}
async function recentProjects() { try { return (await idbGet("recent")) || []; } catch { return []; } }
async function rememberProject(P) {
  try {
    const list = (await recentProjects()).filter(r => r.id !== P.manifest.id);
    list.unshift({ id: P.manifest.id, name: P.manifest.name, folder: P.dir.name, handle: P.dir, openedAt: nowISO() });
    await idbSet("recent", list.slice(0, 8));
  } catch { /* storage unavailable: recent list is a convenience only */ }
}

/* ================================ Model helpers ================================ */
const itemsOf = d => d.template.sections.flatMap(s => s.items.map(it => ({ it, sec: s })));
function respOf(d, id) {
  const r = d.responses[id] ||= { status: d.template.statusOptions[0], values: {} };
  r.values ||= {};
  return r;
}
const hasFieldOf = (d, id) => d.template.responseFields.some(f => f.id === id);
function countsOf(d, items = itemsOf(d)) {
  const c = { total: items.length, byStatus: {}, images: 0 };
  for (const { it } of items) {
    const r = respOf(d, it.id);
    c.byStatus[r.status] = (c.byStatus[r.status] || 0) + 1;
    c.images += r.attachments?.length || 0;
  }
  return c;
}
function instName(d) { const t = d.template; return t.multiInstance ? (d.header[t.instanceField] || "").trim() : ""; }
function reviewLabel(d) { return d.template.title + (d.template.multiInstance ? ` · ${instName(d) || "unnamed unit"}` : ""); }
function statusInfo(d) {
  const c = countsOf(d), open = c.byStatus.Open || 0;
  if (open === 0 && c.total) return { cls: "done", label: "Complete", c };
  const touched = d.log.some(l => l.action !== "create");
  return touched ? { cls: "prog", label: "In review", c } : { cls: "new", label: "Not started", c };
}
/** Bring older review files up to the current shape; fill hierarchy metadata from the catalog. */
function migrate(d) {
  if (d?.kind !== "ffrd-checklist-review" || !d.template) throw new Error("not an FFRD checklist review file");
  d.log ||= []; d.updates ||= []; d.header ||= {}; d.responses ||= {};
  const cat = TPL[d.template.id];
  if (cat) {
    for (const k of ["reviewType", "phase", "order", "multiInstance", "instanceField", "instanceLabel"])
      if (d.template[k] === undefined && cat[k] !== undefined) d.template[k] = cat[k];
    for (const s of d.template.sections) if (s.phase === undefined) { const cs = cat.sections.find(x => x.id === s.id); if (cs?.phase) s.phase = cs.phase; }
  }
  for (const { it } of itemsOf(d)) respOf(d, it.id);
  for (const r of Object.values(d.responses)) for (const a of r.attachments || []) a.id ||= a.file || `img-${rand4()}${rand4()}`;
  return d;
}

/* Shortcuts bound to the open review */
const T = () => doc.template;
const allItems = () => itemsOf(doc);
const resp = id => respOf(doc, id);
const counts = items => countsOf(doc, items);
const hasField = id => hasFieldOf(doc, id);
const cur = () => state.project?.reviews.get(state.current) || null;
const stemOf = file => file.replace(/\.review\.json$/, "");

function log(entry) {
  doc.log.push({ at: nowISO(), by: prefs.name || "(unnamed)", role: prefs.role, ...entry });
  doc.updatedAt = nowISO();
  markDirty();
}
/* ================================ Form dialog ================================ */
/** Each prompt gets its own <dialog>, removed after closing, so one prompt's close event can't leak into the next. */
function openDialog(html) {
  const dlg = document.createElement("dialog");
  dlg.className = "box narrow ask-dlg"; dlg.innerHTML = html;
  document.body.append(dlg);
  dlg.addEventListener("close", () => setTimeout(() => dlg.remove(), 0));
  return dlg;
}
const promptOpen = () => !!document.querySelector("dialog.ask-dlg[open]");
/** Small modal form. fields: [{id,label,value,type:'text'|'longtext'|'select',required,chips:[...]}] → Promise<values|null>
    extra: [{id,label,optional:[fieldIds]}] adds submit buttons; values._action says which button was used ("ok" by default). */
function ask({ title, intro = "", fields, ok = "OK", extra = [], foot = "" }) {
  return new Promise(resolve => {
    const dlg = openDialog(`<form class="ask" novalidate><h2>${esc(title)}</h2>${intro ? `<div>${intro}</div>` : ""}
      ${fields.map(f => `<label>${esc(f.label)}${f.required && f.star !== false ? ' <span class="req">*</span>' : ""}${f.hint ? ` <span class="small muted" style="font-weight:400">${esc(f.hint)}</span>` : ""}
        ${f.chips ? `<span class="pick-row">${f.chips.map(c => `<button type="button" data-chip-for="${esc(f.id)}">${esc(c)}</button>`).join("")}</span>` : ""}
        ${f.type === "longtext" ? `<textarea name="${esc(f.id)}" rows="4">${esc(f.value || "")}</textarea>`
          : f.type === "select" ? `<select name="${esc(f.id)}">${f.options.map(([v, l]) => `<option value="${esc(v)}" ${v === f.value ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`
          : `<input type="text" name="${esc(f.id)}" value="${esc(f.value || "")}" autocomplete="off">`}</label>`).join("")}
      ${foot}<p class="ask-btns"><button type="button" data-cancel>Cancel</button>${extra.map(x => `<button type="submit" data-action="${esc(x.id)}">${esc(x.label)}</button>`).join("")}<button class="primary" type="submit" data-action="ok">${esc(ok)}</button></p></form>`);
    const form = dlg.querySelector("form");
    let done = false;
    form.onsubmit = e => {
      e.preventDefault();
      const action = e.submitter?.dataset.action || "ok", optional = extra.find(x => x.id === action)?.optional || [];
      for (const f of fields) {
        const el = form.elements[f.id];
        el.setCustomValidity(f.required && !optional.includes(f.id) && !el.value.trim() ? "Please fill in this field." : "");
        if (!el.reportValidity()) return;
      }
      done = true; const vals = { ...Object.fromEntries(new FormData(form)), _action: action }; dlg.close(); resolve(vals);
    };
    form.addEventListener("input", e => e.target.setCustomValidity?.(""));
    form.querySelector("[data-cancel]").onclick = () => dlg.close();
    dlg.addEventListener("close", () => { if (!done) resolve(null); });
    form.querySelectorAll("[data-chip-for]").forEach(b => b.onclick = () => {
      const el = form.elements[b.dataset.chipFor]; el.value = el.value.trim() ? `${el.value.trim()}. ${b.textContent}` : b.textContent; el.focus();
    });
    dlg.showModal();
    form.querySelector("input, textarea")?.focus();
  });
}
/** Modal with a message and a row of buttons → Promise<button id | null> */
function choose({ title, html, buttons }) {
  return new Promise(resolve => {
    const dlg = openDialog(`<div class="ask"><h2>${esc(title)}</h2>${html}
      <p class="ask-btns">${buttons.map(b => `<button type="button" data-choice="${esc(b.id)}" class="${b.primary ? "primary" : ""}">${esc(b.label)}</button>`).join("")}</p></div>`);
    dlg.querySelectorAll("[data-choice]").forEach(b => b.onclick = () => { resolve(b.dataset.choice); dlg.close(); });
    dlg.addEventListener("close", () => resolve(null)); // Esc (no-op if a button already resolved)
    dlg.showModal(); dlg.querySelector(".primary")?.focus();
  });
}

    fields: [{ id: "name", label: "FFRD project name", value: dir.name, required: true }, { id: "description", label: "Description (optional)", type: "longtext" }],
    ok: "Create project",
  });

    description: v.description.trim(), createdAt: nowISO(), createdBy: prefs.name };

async function openProjectDir(dir) {
  if (anyDirty() && !confirm("You have unsaved checklist changes in the current project. Discard them?")) return;
  let manifest, manifestFile = await manifestNameIn(dir);
  try { manifest = JSON.parse((await readAt(dir, manifestFile)).text); }
  catch { alert(`“${dir.name}” is not an FFRD project folder (no ${MANIFEST}). Use “Create new project” to set one up.`); return; }
  const P = { dir, manifest, manifestFile, reviews: new Map(), drafts: [], errors: [] };
  await loadReviews(P);
  await collectDrafts(P);
  state.project = P; state.view = "home"; state.current = null; doc = null;
  thumbCache.forEach(u => URL.revokeObjectURL(u)); thumbCache.clear();
  rememberProject(P);
  history.pushState(null, "", "#/project"); route();
}
async function loadReviews(P) {
  P.errors = [];
  const seen = new Set();
  const scan = async (dir, prefix) => {
    for await (const h of dir.values()) {
      if (h.kind !== "file" || !h.name.endsWith(".review.json")) continue;
      if (seen.has(h.name)) { P.errors.push(`${prefix}${h.name}: a checklist with the same file name is also in the project folder; this copy was ignored`); continue; }
      seen.add(h.name);
      if (P.reviews.get(h.name)?.dirty) continue; // keep unsaved in-memory edits
      try {
        const f = await h.getFile();
        const d = migrate(JSON.parse(await f.text()));
        P.reviews.set(h.name, { file: h.name, path: prefix + h.name, doc: d, lastModified: f.lastModified, dirty: false, savedLogLen: d.log.length });
      } catch (e) { P.errors.push(`${prefix}${h.name}: ${e.message}`); }
    }
  };
  await scan(P.dir, "");
  let legacy = null;
  try { legacy = await P.dir.getDirectoryHandle(LEGACY_CHK_DIR); } catch { /* current layout: no subfolder */ }
  if (legacy) await scan(legacy, LEGACY_CHK_DIR + "/");
  for (const [k, R] of P.reviews) if (!seen.has(k) && !R.dirty) P.reviews.delete(k);
}
const anyDirty = () => !!state.project && [...state.project.reviews.values()].some(R => R.dirty);
async function refreshProject() {
  const P = state.project; if (!P) return;
  try { P.manifest = JSON.parse((await readAt(P.dir, P.manifestFile)).text); await loadReviews(P); await collectDrafts(P); render(); toast("Reloaded from the project folder"); }
  catch (e) { alert("Refresh failed: " + e.message); }
}
async function renameProject() {
  const P = state.project;
  const v = await ask({ title: "Rename project", fields: [{ id: "name", label: "FFRD project name", value: P.manifest.name, required: true }, { id: "description", label: "Description", type: "longtext", value: P.manifest.description || "" }], ok: "Save" });
  if (!v) return;
  P.manifest.name = v.name.trim(); P.manifest.description = v.description.trim();
  try { await writeAt(P.dir, P.manifestFile, JSON.stringify(P.manifest, null, 2) + "\n"); rememberProject(P); render(); } catch (e) { alert("Could not save: " + e.message); }
}

/* Drafts: unsaved edits are mirrored to IndexedDB (browser storage with room for embedded images)
   so a crash or closed tab loses nothing. Older versions used localStorage; those are still read. */
const draftPrefix = P => `${LS_DRAFT}${P.manifest.id}:`;
let draftTimer = null;
function markDirty() {
  const R = cur(); if (!R) return;
  const was = R.dirty; R.dirty = true;
  if (!was) { updateSaveState(); renderChrome(); }
  clearTimeout(draftTimer);
  const P = state.project;
  draftTimer = setTimeout(async () => {
    if (!R.dirty) return; // saved in the meantime
    try { await idbSet(draftPrefix(P) + R.file, { savedAt: nowISO(), doc: R.doc }); }
    catch { toast("Draft autosave failed (browser storage full or blocked)"); }
  }, 800);
}
function clearDraft(P, file) {
  const k = draftPrefix(P) + file;
  try { localStorage.removeItem(k); } catch {}
  idbDel(k).catch(() => {});
}
async function collectDrafts(P) {
  P.drafts = [];
  const pre = draftPrefix(P), found = [];
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(pre)) found.push([k, loadJSON(k), "ls"]); } } catch {}
  try { for (const [k, v] of await Promise.race([idbPrefix(pre), new Promise((_, rej) => setTimeout(rej, 3000))])) found.push([k, v, "idb"]); } catch {}
  for (const [k, v, where] of found) {
    const file = k.slice(pre.length), R = P.reviews.get(file);
    if (!v?.doc || !R || R.dirty || P.drafts.some(x => x.file === file && Date.parse(x.savedAt) >= Date.parse(v.savedAt))) continue;
    if (Date.parse(v.savedAt) > R.lastModified) { P.drafts = P.drafts.filter(x => x.file !== file); P.drafts.push({ k, file, savedAt: v.savedAt, doc: v.doc }); }
    else if (where === "ls") { try { localStorage.removeItem(k); } catch {} } else idbDel(k).catch(() => {});
  }
}

/* ================================ Checklists ================================ */
async function startChecklist(tplId) {
  const P = state.project, tpl = TPL[tplId];
  let inst = "";
  if (tpl.multiInstance) {
    const v = await ask({ title: `Add ${tpl.instanceLabel}`, intro: `<p class="small">Creates a separate <b>${esc(tpl.title)}</b> checklist for this unit.</p>`,
      fields: [{ id: "name", label: `${tpl.instanceLabel} name`, required: true }], ok: "Create checklist" });
    if (!v) return;
    inst = v.name.trim();
    if ([...P.reviews.values()].some(R => R.doc.template.id === tplId && instName(R.doc).toLowerCase() === inst.toLowerCase())) { alert(`A checklist for “${inst}” already exists.`); return; }
  }
  const stem = tpl.multiInstance ? `${tpl.id}--${slug(inst)}` : tpl.id;
  let file = `${stem}.review.json`, n = 2;
  while (P.reviews.has(file)) file = `${stem}-${n++}.review.json`;
  const t = clone(tpl); delete t.$schema;
  const d = { kind: "ffrd-checklist-review", schemaVersion: "1.2", id: stemOf(file), projectId: P.manifest.id,
    createdAt: nowISO(), updatedAt: nowISO(), template: t, header: {}, responses: {}, log: [], updates: [] };
  if (t.headerFields.some(f => f.id === "ffrdProjectName")) d.header.ffrdProjectName = P.manifest.name;
  if (t.multiInstance) d.header[t.instanceField] = inst;
  for (const { it } of itemsOf(d)) respOf(d, it.id);
  const by = prefs.name || "(unnamed)";
  d.log.push({ at: nowISO(), by, role: prefs.role, action: "create", to: `${t.id}@${t.templateVersion || "?"}` });
  d.updates.push({ at: nowISO(), by, role: prefs.role, summary: "Checklist created", changes: 0, counts: countsOf(d).byStatus });
  try {
    const fh = await writeAt(P.dir, file, JSON.stringify(d, null, 2) + "\n");
    P.reviews.set(file, { file, path: file, doc: d, lastModified: (await fh.getFile()).lastModified, dirty: false, savedLogLen: d.log.length });
  } catch (e) { alert("Could not create the checklist file: " + e.message); return; }
  openReview(file);
}
/** Field-level changes made since the last *logged* update (in-progress saves don't count as one). */
function unlogged(d) { const last = d.updates.at(-1)?.at; return last ? d.log.filter(l => l.at > last) : d.log.filter(l => l.action !== "create"); }
/** Save the open checklist (only that file). quick = in-progress save: no dialog, nothing added to the
    update history. Otherwise the dialog offers both. Resolves true when written. */
async function saveCurrent({ quick = false } = {}) {
  const P = state.project, R = cur(); if (!R) return false;
  const d = R.doc, newLog = unlogged(d), c = countsOf(d), imgs = Object.values(d.responses).flatMap(r => r.attachments || []);
  let note = null;
  if (!quick) {
    const v = await ask({
      title: "Save checklist",
      intro: `<p class="small">Saves <b>${esc(reviewLabel(d))}</b> only, to <code>${esc(R.path)}</code>. Other checklists in the project are not affected.${imgs.length ? ` Its ${plural(imgs.length, "image")} (${mb(imgs.reduce((n, a) => n + (a.data ? a.data.length * 0.75 : a.size || 0), 0))}) ${imgs.length > 1 ? "are" : "is"} saved inside the file.` : ""}</p>
        <p><b>${c.byStatus.Open || 0}</b> open · <b>${c.byStatus.Closed || 0}</b> closed · <b>${c.byStatus["N/A"] || 0}</b> N/A of ${c.total} items</p>
        <p class="small">${newLog.length ? `${plural(newLog.length, "change")} since the last logged update:` : "No item changes since the last logged update."}</p>
        ${newLog.length ? `<ul class="small change-list">${newLog.slice(-8).reverse().map(l => `<li>${l.itemId ? `<b>${esc(l.itemId)}</b> ` : ""}${esc(describe(l))}</li>`).join("")}${newLog.length > 8 ? `<li class="muted">…and ${newLog.length - 8} more</li>` : ""}</ul>` : ""}`,
      fields: [...(prefs.name ? [] : [{ id: "who", label: "Your name", required: true }]),
        { id: "summary", label: "Status note for the update history", hint: "(needed only for Save and log update)", star: false, type: "longtext", required: true, chips: STATUS_CHIPS[prefs.role] }],
      foot: `<p class="small muted"><b>Save in progress</b> just saves your work (no note needed; Ctrl+S does the same). <b>Save and log update</b> also adds your note to this checklist's update history.</p>`,
      extra: [{ id: "quick", label: "Save in progress", optional: ["summary"] }],
      ok: "Save and log update",
    });
    if (!v) return false;
    if (v.who) { prefs.name = v.who.trim(); saveLS(LS_PREFS, prefs); renderTop(); }
    if (v._action !== "quick") note = v.summary.trim();
  }
  const path = R.path;
  try {
    let changedOnDisk = false;
    try { changedOnDisk = (await (await fileAt(P.dir, path)).getFile()).lastModified > R.lastModified; } catch { /* file missing: just write it */ }
    if (changedOnDisk && !confirm(`${R.file} was changed on disk after you opened it (possibly by someone else).\n\nOverwrite it with your version?`)) return false;
    const emb = await embedLegacyImages(P, d);
    if (emb.missing.length && !confirm(`${plural(emb.missing.length, "image")} referenced by this checklist could not be found in the project folder:\n\n${emb.missing.slice(0, 6).join("\n")}\n\nSave anyway? (Those references are kept but won't display.)`)) return false;
    d.schemaVersion = "1.2"; d.updatedAt = nowISO();
    if (note !== null) d.updates.push({ at: d.updatedAt, by: prefs.name || "(unnamed)", role: prefs.role, summary: note, changes: newLog.length, counts: { ...c.byStatus } });
    let fh;
    try { fh = await writeAt(P.dir, path, JSON.stringify(d, null, 2) + "\n"); } catch (e) { if (note !== null) d.updates.pop(); throw e; }
    R.lastModified = (await fh.getFile()).lastModified; R.dirty = false; R.savedLogLen = d.log.length;
    clearTimeout(draftTimer); clearDraft(P, R.file);
    if (state.view === "review") rerenderKeepScroll(); else render();
    toast(`${note !== null ? "Saved and logged" : "Saved in progress (not added to the update history)"}: ${reviewLabel(d)}${emb.embedded ? `. ${plural(emb.embedded, "image")} from the attachments folder ${emb.embedded > 1 ? "are" : "is"} now stored in the checklist file` : ""}`);
    return true;
  } catch (e) { alert("Save failed: " + e.message); return false; }
}

async function importReviewFile(f) {

      if (!v) return; d.header[t.instanceField] = v.name.trim();
    }

    if (!t.multiInstance && P.reviews.has(`${t.id}.review.json`) && !confirm(`This project already has a ${t.title} checklist. Import as an additional copy (${file})?`)) return;
    d.id = stemOf(file); d.projectId = P.manifest.id;
    d.updates.push({ at: nowISO(), by: prefs.name || "(unnamed)", role: prefs.role, summary: `Imported from ${f.name}`, changes: 0, counts: countsOf(d).byStatus });

/* ================================ Images ================================ */
/* Images are stored inside the checklist file as base64 data URIs (attachment.data), so a checklist
   and its images travel as one file. Older files may hold attachment.file (a path in the project
   folder); those still display, and are embedded the next time that checklist is saved. */
const BIG_IMAGE = 2e6, MAX_SIDE = 2560;
const thumbCache = new Map(); // attachment id -> object URL
function dataURLtoBlob(u) {
  const m = /^data:([^;,]+);base64,(.*)$/s.exec(u); if (!m) throw new Error("not a base64 image");
  const bin = atob(m[2]), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: m[1] });
}
const blobToDataURL = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(b); });
const attKey = a => a.id || a.file;
async function attURL(a) {
  const k = attKey(a);
  if (thumbCache.has(k)) return thumbCache.get(k);
  const blob = a.data ? dataURLtoBlob(a.data) : await (await fileAt(state.project.dir, a.file)).getFile();
  const u = URL.createObjectURL(blob); thumbCache.set(k, u); return u;
}
function hydrateThumbs() {
  app.querySelectorAll("img[data-att]:not([data-loaded])").forEach(async img => {
    img.dataset.loaded = "1";
    const [iid, k] = img.dataset.att.split("|"), a = doc && respOf(doc, iid).attachments?.[+k];
    try { if (!a) throw 0; img.src = await attURL(a); }
    catch { img.classList.add("missing"); img.closest(".thumb-btn")?.append(Object.assign(document.createElement("span"), { className: "small muted", textContent: "image missing" })); }
  });
}
new MutationObserver(() => hydrateThumbs()).observe(app, { childList: true, subtree: true });

/** Re-encode an image so its longest side is at most MAX_SIDE px (JPEG, or PNG if it has transparency). */
async function shrinkImage(f) {
  const bmp = await createImageBitmap(f);
  const k = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const g = c.getContext("2d"); g.drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
  let alpha = false;
  if (f.type === "image/png" || f.type === "image/webp" || f.type === "image/gif") {
    const px = g.getImageData(0, 0, c.width, c.height).data;
    for (let i = 3; i < px.length; i += 16) if (px[i] < 255) { alpha = true; break; }
  }
  if (!alpha) { g.globalCompositeOperation = "destination-over"; g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); }
  const type = alpha ? "image/png" : "image/jpeg";
  const blob = await new Promise(r => c.toBlob(r, type, 0.88));
  return blob && blob.size < f.size ? new File([blob], (f.name || "image").replace(/\.\w+$/, "") + (alpha ? ".png" : ".jpg"), { type }) : f;
}
async function imageSize(f) { try { const b = await createImageBitmap(f); const s = { width: b.width, height: b.height }; b.close?.(); return s; } catch { return {}; } }
const mb = n => (n / 1e6).toFixed(1) + " MB";

async function addImages(itemId, fileList) {
  const R = cur(); if (!R) return;
  const files = [...fileList].filter(f => f.type.startsWith("image/"));
  if (!files.length) { toast("No image found. Only image files can be attached."); return; }
  const r = resp(itemId); r.attachments ||= [];
  let added = 0;
  for (let f of files) {
    const pasted = !f.name || /^image\.\w+$/.test(f.name);
    const name = pasted ? `Pasted image ${new Date().toLocaleString()}` : f.name;
    if (f.size > BIG_IMAGE && f.type !== "image/svg+xml") {
      const c = await choose({ title: "Large image", html: `<p><b>${esc(name)}</b> is ${mb(f.size)}.</p>
        <p class="small">Images are stored inside the checklist file, so large ones make it slower to save, sync and email.
        Reducing it to at most ${MAX_SIDE} px usually brings it well under 1 MB and keeps it readable.</p>`,
        buttons: [{ id: "skip", label: "Don't attach" }, { id: "keep", label: "Keep original" }, { id: "shrink", label: "Reduce size", primary: true }] });
      if (!c || c === "skip") continue;
      if (c === "shrink") { try { f = await shrinkImage(f); } catch { toast("Couldn't reduce this image; keeping the original"); } }
    }
    let data;
    try { data = await blobToDataURL(f); } catch (e) { alert("Could not read the image: " + e.message); continue; }
    const id = `img-${stamp()}-${rand4()}`;
    thumbCache.set(id, URL.createObjectURL(f));
    r.attachments.push({ id, name, caption: "", type: f.type, size: f.size, ...(await imageSize(f)),
      addedAt: nowISO(), addedBy: prefs.name || "(unnamed)", role: prefs.role, data });
    log({ action: "add-image", itemId, to: name });
    added++;
  }
  if (added) { ui.expanded.add(itemId); rerenderItem(itemId); refreshStats(); toast(`${plural(added, "image")} attached to ${itemId}. Save the checklist to keep ${added > 1 ? "them" : "it"}.`); }
}
function removeImage(itemId, k) {
  const r = resp(itemId), a = r.attachments?.[k]; if (!a) return;
  if (!confirm(`Remove “${a.caption || a.name}” from ${itemId}?\n\nThe image is deleted from this checklist when you save. The change log keeps a note that it was removed.`)) return;
  r.attachments.splice(k, 1);
  log({ action: "remove-image", itemId, from: a.caption || a.name });
  rerenderItem(itemId); refreshStats();
}
/** Embed any legacy file-referenced images of a review in place. Returns {embedded, missing[]}. */
async function embedLegacyImages(P, d) {
  let embedded = 0; const missing = [];
  for (const [iid, r] of Object.entries(d.responses))
    for (const a of r.attachments || []) {
      if (a.data || !a.file) continue;
      try {
        const f = await (await fileAt(P.dir, a.file)).getFile();
        a.data = await blobToDataURL(f.type ? f : new Blob([f], { type: "image/" + (/\.(\w+)$/.exec(a.file)?.[1] || "png").replace("jpg", "jpeg") }));
        a.size = f.size; a.type ||= f.type; a.embeddedFrom = a.file; delete a.file; embedded++;
      } catch { missing.push(`${iid}: ${a.file}`); }
    }
  return { embedded, missing };
}

/* ---- Viewer: wheel / pinch zoom around the pointer, drag to pan ---- */
const V = { itemId: null, list: [], idx: 0, s: 1, x: 0, y: 0, fit: 1, ptrs: new Map(), pinch: null };

}
async function showViewerImage() {

  $("#vCaption").value = a.caption || "";

/* ================================ Navigation: project › phase › checklist ================================ */
// Routes live in the URL hash (#/project, #/phase/<id>, #/checklist/<file>) so the browser Back button works.
const DEPTH = { home: 0, project: 1, phase: 2, review: 3 };
let pendingSection = null;
async function navigate(hash, { section } = {}) {
  const R = cur();
  if (state.view === "review" && R?.dirty && decodeURIComponent(hash) !== `#/checklist/${R.file}`) {
    const ch = await choose({
      title: "Save this checklist?",
      html: `<p><b>${esc(reviewLabel(R.doc))}</b> has unsaved changes.</p>
        <p class="small muted">Each checklist is saved on its own. If you leave without saving, your changes are kept in this browser and the checklist shows as <b>Unsaved</b> until you come back and save it.</p>`,
      buttons: [{ id: "stay", label: "Stay here" }, { id: "leave", label: "Leave without saving" }, { id: "save", label: "Save checklist…", primary: true }],
    });
    if (!ch || ch === "stay") return;
    if (ch === "save" && !(await saveCurrent())) return;
  }
  pendingSection = section || null;
  if (location.hash !== hash) history.pushState(null, "", hash);
  route();
}
function route() {
  const prev = { view: state.view, file: state.current, phase: state.phase };
  const [kind, ...rest] = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/");
  const arg = rest.join("/"), P = state.project;
  if (!P) { state.view = "home"; if (kind && kind !== "home") history.replaceState(null, "", "#/home"); }
  else if (kind === "phase" && PHASE[arg]) { state.view = "phase"; state.phase = arg; }
  else if (kind === "checklist" && P.reviews.has(arg)) { state.view = "review"; state.current = arg; }
  else { state.view = "project"; if (kind !== "project") history.replaceState(null, "", "#/project"); }
  if (state.view === "review") {
    doc = P.reviews.get(state.current).doc;
    if (prev.view !== "review" || prev.file !== state.current) {
      Object.assign(ui, { q: "", status: "all", expandAll: false, lastItem: null }); ui.expanded.clear();
    }
  } else { doc = null; state.current = null; }
  const left = prev.view === "review" && prev.file !== state.current && P?.reviews.get(prev.file);
  if (left?.dirty) toast(`“${reviewLabel(left.doc)}” still has unsaved changes`);
  render();
  const step = DEPTH[state.view] - DEPTH[prev.view];
  if (step) { app.classList.remove("in-fwd", "in-back"); void app.offsetWidth; app.classList.add(step > 0 ? "in-fwd" : "in-back"); }
  const sec = pendingSection && document.getElementById(pendingSection); pendingSection = null;
  if (sec) sec.scrollIntoView(); else if (step || prev.file !== state.current || prev.phase !== state.phase) scrollTo(0, 0);
  document.body.classList.remove("toc-open"); $("#btnToc").setAttribute("aria-expanded", "false");
  $("#toc [aria-current=page], #toc .current")?.scrollIntoView({ block: "nearest" });
}
window.addEventListener("popstate", route);
document.addEventListener("click", e => {

  const a = e.target.closest('a[href^="#/"]'); if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;

/* ---- Contents pane: Project › Phase › Checklist type › Checklist (› its sections) ---- */
/** "open/total" item count, e.g. 112/115; green when nothing is open. */

    return `${ph}<a href="#${esc(s.id)}" data-jump="${esc(s.id)}"><span class="t-name">${esc(s.title)}</span>${openTotal(countsOf(R.doc, s.items.map(it => ({ it }))))}</a>`;

  e.preventDefault();
  const card = state.view === "review" && e.target.closest?.("[data-item]");
  app.querySelectorAll(".drop-over").forEach(c => c !== card && c.classList.remove("drop-over"));
  if (card) card.classList.add("drop-over");
});
document.addEventListener("dragleave", e => { if (!e.relatedTarget) app.querySelectorAll(".drop-over").forEach(c => c.classList.remove("drop-over")); });
document.addEventListener("drop", e => {
  e.preventDefault();
  app.querySelectorAll(".drop-over").forEach(c => c.classList.remove("drop-over"));
  const card = state.view === "review" && e.target.closest?.("[data-item]");
  if (card) addImages(card.dataset.item, e.dataTransfer.files);
  else if (state.view === "review" && e.dataTransfer.files.length) toast("Drop images onto a specific checklist item");
});

/* Top bar & menu */
$("#btnUser").onclick = editUser;
$("#btnMore").onclick = e => { e.stopPropagation(); $("#moreMenu").classList.toggle("open"); };
document.addEventListener("click", () => $("#moreMenu").classList.remove("open"));
$("#menuList").addEventListener("click", e => {
  const act = e.target.dataset.act; if (!act) return;
  if (act === "theme") { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; prefs.theme = r.dataset.theme; saveLS(LS_PREFS, prefs); return; }
  if (act === "refresh") refreshProject();
  if (act === "rename") renameProject();
  if (act === "import") $("#jsonInput").click();
  if (act === "close") { if (anyDirty() && !confirm("Close the project and discard unsaved changes? (They stay in this browser as drafts.)")) return; state.project = null; state.current = null; doc = null; state.view = "project"; history.pushState(null, "", "#/home"); route(); }
  if (!doc) return;
  if (act === "updates") showUpdates();
  if (act === "log") showLog();
  if (act === "csv") exportCSV();
  if (act === "md") exportMD();
  if (act === "print") { ui.expandAll = true; renderReview(); setTimeout(() => print(), 300); }
});
$("#jsonInput").addEventListener("change", e => { const f = e.target.files[0]; if (f) importReviewFile(f); e.target.value = ""; });
if (prefs.theme) document.documentElement.dataset.theme = prefs.theme;
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (state.view === "review" && !promptOpen()) saveCurrent({ quick: true }); } });
window.addEventListener("beforeunload", e => { if (anyDirty()) { e.preventDefault(); e.returnValue = ""; } });
$("#dlgClose").onclick = () => $("#dlg").close();

/* ================================ Exports & dialogs ================================ */
function exportName(ext) { return `${(state.project?.manifest.name || "project").replace(/[^\w.-]+/g, "_")}_${stemOf(state.current)}.${ext}`; }
function exportCSV() {
  const t = T(), cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Section", "ID", "Review Item", "Status", ...t.responseFields.map(f => f.label), "Images", "Last updated", "Updated by"]];
  for (const { it, sec } of allItems()) {
    const r = resp(it.id);
    rows.push([sec.title, it.id, it.text, r.status, ...t.responseFields.map(f => r.values[f.id] || ""),
      (r.attachments || []).map(a => (a.caption || a.name) + (a.caption && a.name ? ` [${a.name}]` : "")).join("; "), r.updatedAt || "", r.updatedBy || ""]);
  }
  download(exportName("csv"), "﻿" + rows.map(r => r.map(cell).join(",")).join("\r\n"), "text/csv");
}
function exportMD() {
  const t = T(), c = counts(allItems()), last = doc.updates.at(-1);
  const lines = [`# ${reviewLabel(doc)}`, "", `*${t.reviewType === "QA" ? "QA, all phases" : `QC, ${phaseLabel(t.phase)}`} · ${state.project.manifest.name}*`, "",
    ...t.headerFields.map(f => `- **${f.label}:** ${doc.header[f.id] || "—"}`), "",
    `**Open:** ${c.byStatus.Open || 0} · **Closed:** ${c.byStatus.Closed || 0} · **N/A:** ${c.byStatus["N/A"] || 0} · **Total:** ${c.total}`, "",
    ...(last ? [`**Latest update** (${last.by}, ${fmtTime(last.at)}): ${last.summary}`, ""] : [])];
  for (const s of t.sections) {
    lines.push(`## ${s.title}`, "");
    for (const it of s.items) {
      const r = resp(it.id);
      lines.push(`- [${r.status === "Open" ? " " : "x"}] **${it.id}** (${r.status}) ${it.text.replace(/\n+/g, " ")}`);
      for (const f of t.responseFields) if ((r.values[f.id] || "").trim()) lines.push(`  - *${f.label}:* ${r.values[f.id].replace(/\n+/g, " ")}`);
      for (const a of r.attachments || []) lines.push(`  - *Image:* ${a.caption || a.name}${a.caption && a.name ? ` (${a.name})` : ""}`);
    }
    lines.push("");
  }
  download(exportName("md"), lines.join("\n"), "text/markdown");
}
function showLog() {
  $("#dlgBody").innerHTML = `<h2 style="margin-top:0">Detailed change log (${doc.log.length})</h2>
    <table class="log-table"><thead><tr><th>When</th><th>Who</th><th>Item</th><th>Change</th></tr></thead><tbody>
    ${doc.log.slice().reverse().map(l => `<tr><td>${esc(fmtTime(l.at))}</td><td>${esc(l.by)}<br><span class="muted">${esc(l.role || "")}</span></td><td>${esc(l.itemId || "")}</td><td class="v">${esc(describe(l))}</td></tr>`).join("")}
    </tbody></table>`;
  $("#dlg").showModal();
}
function showUpdates() {
  $("#dlgBody").innerHTML = `<h2 style="margin-top:0">Update history: ${esc(reviewLabel(doc))}</h2>
    <p class="small muted">One entry per <i>Save and log update</i>, with the note entered at the time. In-progress saves aren't listed.</p>
    <table class="log-table"><thead><tr><th>When</th><th>Who</th><th>Status note</th><th>Open / Closed / N/A</th><th>Changes</th></tr></thead><tbody>
    ${doc.updates.slice().reverse().map(u => `<tr><td>${esc(fmtTime(u.at))}</td><td>${esc(u.by)}<br><span class="muted">${esc(u.role || "")}</span></td><td class="v">${esc(u.summary)}</td>
      <td>${u.counts ? `${u.counts.Open || 0} / ${u.counts.Closed || 0} / ${u.counts["N/A"] || 0}` : ""}</td><td>${u.changes ?? ""}</td></tr>`).join("")}
    </tbody></table>`;
  $("#dlg").showModal();
}

history.replaceState(null, "", "#/home");
route();
</script>
</body>
</html>
