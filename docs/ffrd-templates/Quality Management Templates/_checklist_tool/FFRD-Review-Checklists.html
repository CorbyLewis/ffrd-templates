<title>FFRD Review Checklists</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2430; --muted: #5d6878; --line: #dde2ea;
  --accent: #1f6feb; --accent-ink: #ffffff; --accent-soft: #e6efff;
  --open: #b54708; --open-soft: #fff4e5; --closed: #1a7f37; --closed-soft: #e8f6ec;
  --na: #667085; --na-soft: #eef0f3; --danger: #c62828; --mark: #fff3a3;
  --qa: #6b3fd4; --qa-soft: #f0eaff; --qc: #0e7490; --qc-soft: #e0f5f9;
  --radius: 8px; --shadow: 0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --panel: #171c23; --ink: #e6e9ee; --muted: #9aa5b4; --line: #2a323d;
    --accent: #4c8dff; --accent-ink: #0b0f14; --accent-soft: #1b2a44;
    --open: #f5a35c; --open-soft: #3a2614; --closed: #5cc97a; --closed-soft: #14301d;
    --na: #a3acb9; --na-soft: #262c35; --danger: #ff6b6b; --mark: #5c5113;
    --qa: #b69cff; --qa-soft: #2a2145; --qc: #5fd0e6; --qc-soft: #12313a;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --panel: #171c23; --ink: #e6e9ee; --muted: #9aa5b4; --line: #2a323d;
  --accent: #4c8dff; --accent-ink: #0b0f14; --accent-soft: #1b2a44;
  --open: #f5a35c; --open-soft: #3a2614; --closed: #5cc97a; --closed-soft: #14301d;
  --na: #a3acb9; --na-soft: #262c35; --danger: #ff6b6b; --mark: #5c5113;
  --qa: #b69cff; --qa-soft: #2a2145; --qc: #5fd0e6; --qc-soft: #12313a;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 10px; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--danger); }
button.linkish { border: 0; background: none; padding: 0; color: inherit; text-align: left; font-weight: 600; }
button.linkish:hover { color: var(--accent); text-decoration: underline; }
input[type=text], input[type=date], input[type=search], select, textarea {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 8px; width: 100%; }
textarea { resize: vertical; min-height: 34px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.spacer { flex: 1; }
h2 { font-size: 16px; margin: 20px 0 10px; }

/* App bar: always visible; shows the open project */
header.top { position: sticky; top: 0; z-index: 30; display: flex; gap: 12px; align-items: center; padding: 8px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: 0 1px 3px rgba(16,24,40,.06); min-height: 52px; }
.brand { color: var(--muted); text-decoration: none; font-weight: 700; font-size: 13px; white-space: nowrap; }
.brand:hover { color: var(--accent); }
.has-project .brand { font-size: 11px; letter-spacing: .06em; padding: 3px 7px; border: 1px solid var(--line); border-radius: 5px; }
.proj-head { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.proj-head a { color: inherit; text-decoration: none; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj-head a:hover { color: var(--accent); }
.proj-head .small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-kpis { display: flex; gap: 14px; align-items: center; font-size: 13px; white-space: nowrap; }
.bar-kpis b { font-variant-numeric: tabular-nums; }
.bar-kpis .open-num { color: var(--open); }
.bar-kpis a.chip { text-decoration: none; }
.toc-toggle { display: none; font-size: 18px; line-height: 1; padding: 4px 9px; }

/* Shell: contents pane + page */
.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
.shell.no-project { display: block; }
.shell.no-project .toc { display: none; }
.shell.no-project main { max-width: 1100px; margin: 0 auto; }
.toc { position: sticky; top: var(--bar-h, 52px); height: calc(100vh - var(--bar-h, 52px)); overflow: auto; overscroll-behavior: contain;
  background: var(--panel); border-right: 1px solid var(--line); padding: 10px 8px 28px; font-size: 13px; }
.t-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 14px 8px 4px; }
.t-row { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; color: inherit; text-decoration: none; min-height: 30px; }
a.t-row:hover, button.t-row:hover { background: var(--accent-soft); }
button.t-row { width: 100%; border: 0; background: none; text-align: left; }
.t-row[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.t-row[aria-current="page"] .t-cnt, .t-row[aria-current="page"] .muted { color: inherit; opacity: .85; }
.t-row .t-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-cnt { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-cnt.has-open, .sec-cnt.has-open { color: var(--open); font-weight: 600; }
.t-cnt.all-done, .sec-cnt.all-done { color: var(--closed); }
.sec-cnt { font-size: 13px; font-variant-numeric: tabular-nums; }
.sec-cnt-l { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: -4px; }
.metric { display: inline-flex; align-items: baseline; gap: 1px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.metric b { font-size: 22px; line-height: 1; }
.metric > span { font-size: 15px; font-weight: 600; color: var(--muted); }
.metric small { font-size: 12px; color: var(--muted); margin-left: 4px; }
.metric.has-open b { color: var(--open); }
.metric.all-done b { color: var(--closed); }
.t-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--open); flex: none; }
.t-phase-row { padding-left: 2px; font-weight: 600; }
.t-twist { border: 0; background: none; padding: 0; width: 20px; height: 22px; color: var(--muted); font-size: 11px; flex: none; transition: transform .15s; }
.t-phase.collapsed .t-twist { transform: rotate(-90deg); }
.t-phase.collapsed > .t-kids { display: none; }
.t-phase-row a { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; color: inherit; text-decoration: none; padding: 2px 0; }
.t-phase-row a:hover .t-name { color: var(--accent); }
.t-phase-row.current { background: var(--accent); color: var(--accent-ink); }
.t-phase-row.current .t-twist, .t-phase-row.current .t-cnt { color: inherit; }
.t-phase-row.current a:hover .t-name { color: inherit; }
.pnum.sm { width: 22px; height: 22px; font-size: 11px; border-width: 2px; }
.t-kids { margin-left: 20px; border-left: 1px solid var(--line); padding-left: 4px; }
.t-kids .t-kids { margin-left: 10px; }
.t-type { padding: 5px 8px 3px; color: var(--muted); font-size: 12px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.t-new { color: var(--muted); }
.t-new .t-plus { font-size: 11px; border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; }
.t-new:hover .t-plus { border-color: var(--accent); color: var(--accent); }
.t-gate { color: var(--qa); }
.t-secs { margin: 2px 0 6px 12px; border-left: 2px solid var(--accent); padding-left: 4px; }
.t-secs a { display: flex; gap: 6px; justify-content: space-between; padding: 3px 8px; border-radius: 5px; color: inherit; text-decoration: none; font-size: 12px; }
.t-secs a:hover { background: var(--accent-soft); }
.t-secs .t-sec-phase { font-size: 10px; font-weight: 700; color: var(--qc); padding: 6px 8px 1px; text-transform: uppercase; letter-spacing: .04em; }
.toc-scrim { display: none; }
.user-chip { display: inline-flex; gap: 6px; align-items: center; border-radius: 16px; padding: 3px 10px 3px 3px; font-size: 13px; max-width: 60vw; white-space: nowrap; overflow: hidden; }
.avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.menu { position: relative; display: inline-block; }
#btnMore { white-space: nowrap; }
.menu-list { position: absolute; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: 0 6px 24px rgba(0,0,0,.15); padding: 4px; min-width: 230px; display: none; z-index: 20; }
.menu.open .menu-list { display: block; }
.menu-list button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; }
.menu-list button:hover { background: var(--accent-soft); }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

main { padding: 16px 24px 40px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.banner { padding: 8px 12px; margin-bottom: 12px; background: var(--accent-soft); border-radius: var(--radius); font-size: 13px; }
.banner.warn { background: var(--open-soft); }
.empty { padding: 30px; text-align: center; color: var(--muted); }

/* Tags & status chips */
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; white-space: nowrap; }
.tag.qa { background: var(--qa-soft); color: var(--qa); }
.tag.qc { background: var(--qc-soft); color: var(--qc); }
.tag.unit { background: var(--na-soft); color: var(--muted); }
.st { font-size: 12px; padding: 1px 8px; border-radius: 10px; white-space: nowrap; justify-self: start; }
.st-done { background: var(--closed-soft); color: var(--closed); font-weight: 600; }
.st-prog { background: var(--open-soft); color: var(--open); font-weight: 600; }
.st-new, .st-none { background: var(--na-soft); color: var(--muted); }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--na-soft); color: var(--muted); border: 0; }
.chip.unsaved { background: var(--open-soft); color: var(--open); font-weight: 600; }
.chip.img { background: var(--accent-soft); color: var(--accent); cursor: pointer; }
.chip.note { background: var(--mark); color: var(--ink); }
.chip.phase { background: var(--qc-soft); color: var(--qc); font-weight: 600; }
.bar { flex: 1; min-width: 80px; height: 8px; border-radius: 4px; background: var(--na-soft); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.qc-prog .bar, .qa-seg .bar { flex: none; width: 100%; }

/* Home */
.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.tile { padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.catalog .card { padding: 10px 12px; }
.catalog h4 { margin: 0 0 6px; font-size: 13px; }
.catalog ul { margin: 0; padding-left: 16px; font-size: 12px; color: var(--muted); }

/* Page header (every level): breadcrumb, level label, title, actions */
.page-head { margin: -16px -24px 16px; padding: 12px 24px; background: var(--bg); border-bottom: 1px solid var(--line); }
.page-head.sticky { position: sticky; top: var(--bar-h, 52px); z-index: 9; box-shadow: 0 2px 6px rgba(16,24,40,.05); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 12px; margin: 0 0 2px; }
.crumbs a { color: var(--accent); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.crumbs .sep { color: var(--muted); }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.title-block { flex: 1; min-width: 220px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.page-head h1 { font-size: 22px; margin: 2px 0 0; line-height: 1.25; }
.page-head h1 .sub { color: var(--muted); font-weight: 500; }
.head-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.head-meta { display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: center; margin-top: 8px; font-size: 13px; }
.ck-stats { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.ck-stats .bar { width: 140px; flex: none; }
.save-box { display: flex; align-items: center; gap: 10px; }
.save-state { font-size: 13px; white-space: nowrap; }
.save-state.dirty { color: var(--open); font-weight: 600; }
.save-state.clean { color: var(--closed); }
.kpis { display: flex; gap: 24px; }
.kpis div { display: flex; flex-direction: column; align-items: flex-end; }
.kpis b { font-size: 20px; font-variant-numeric: tabular-nums; }
.kpis .open-num { color: var(--open); }
.kpis span { font-size: 12px; color: var(--muted); }
.section-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; }
.page-head + .section-h, .page-head + .banner { margin-top: 0; }

/* Lists of things you can drill into */
.list-row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; color: inherit; text-decoration: none; }
a.list-row:hover { background: var(--accent-soft); }
a.list-row:hover .chev { color: var(--accent); }
.lr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--muted); font-size: 22px; line-height: 1; flex: none; }
.mini { display: flex; flex-direction: column; gap: 3px; width: 140px; flex: none; }
.mini .bar, .gate-card .bar { flex: none; width: 100%; }
.gate-card .bar { width: 140px; }
.qa-row { border-left: 4px solid var(--qa); }
.gate-card { border-left: 4px solid var(--qa); flex-wrap: wrap; }
.phase-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pnum { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none;
  border: 2px solid var(--line); font-weight: 700; font-size: 13px; background: var(--panel); }
.pnum.done { border-color: var(--closed); color: var(--closed); }
.pnum.prog { border-color: var(--open); color: var(--open); }
.gate-pill { font-size: 12px; color: var(--qa); background: var(--qa-soft); padding: 1px 8px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
.ck-list { overflow: hidden; }
.ck-list > .list-row, .ck-group > .list-row, .ck-list > .ck-group { border-bottom: 1px solid var(--line); }
.ck-list > :last-child, .ck-group > .list-row:last-child { border-bottom: 0; }
.ck-group-head { background: var(--bg); }
.list-row.indent { padding-left: 36px; }
a.btn { border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; text-decoration: none; color: inherit; background: var(--panel); white-space: nowrap; }
a.btn:hover { border-color: var(--accent); }
.footnote { margin-top: 20px; }

/* Drill-down motion */
@keyframes inFwd { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes inBack { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
#app.in-fwd { animation: inFwd .2s ease-out; }
#app.in-back { animation: inBack .2s ease-out; }
@media (prefers-reduced-motion: reduce) { #app.in-fwd, #app.in-back { animation: none; } }

/* Review */
.item .itext { min-width: 0; }
.header-form { padding: 12px 14px; margin-bottom: 12px; }
.header-form summary { cursor: pointer; font-weight: 600; }
.hf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px 14px; margin-top: 10px; }
.hf-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.hf-grid label.inst { color: var(--ink); font-weight: 600; }
.hf-group { grid-column: 1 / -1; font-weight: 600; font-size: 12px; color: var(--ink); margin-top: 6px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.filters input[type=search] { flex: 1; min-width: 200px; }
.filters select { width: auto; }
section.sec { margin-bottom: 16px; scroll-margin-top: calc(var(--bar-h, 52px) + var(--head-h, 0px) + 12px); }
section.sec > h3 { font-size: 14px; margin: 0 0 6px; padding: 6px 2px; display: flex; gap: 8px; align-items: center; border-bottom: 2px solid var(--accent); }
section.sec > h3 .t { flex: 1; }
.item { margin-bottom: 6px; padding: 8px 12px; border-left: 4px solid var(--open); scroll-margin-top: calc(var(--bar-h, 52px) + var(--head-h, 0px) + 8px); }
.item:focus { outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
.item.s-closed { border-left-color: var(--closed); }
.item.s-na { border-left-color: var(--na); opacity: .85; }
.item.drop-over { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }
.item .row1 { display: flex; gap: 10px; align-items: flex-start; }
.item .iid { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); padding-top: 2px; min-width: 70px; }
.item .itext { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; cursor: pointer; }
.item .itext mark { background: var(--mark); color: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 0 80px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
.seg button { border: 0; border-radius: 0; padding: 3px 9px; font-size: 12px; background: transparent; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on[data-v="Open"] { background: var(--open-soft); color: var(--open); font-weight: 600; }
.seg button.on[data-v="Closed"] { background: var(--closed-soft); color: var(--closed); font-weight: 600; }
.seg button.on[data-v="N/A"] { background: var(--na-soft); color: var(--ink); font-weight: 600; }
.seg button.on.other { background: var(--accent-soft); font-weight: 600; }
.detail { margin: 10px 0 4px 80px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
.detail label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.detail label .role { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
.detail label.mine { color: var(--ink); font-weight: 600; }
.detail label.mine textarea, .detail label.mine input { border-color: var(--accent); }
.detail .full { grid-column: 1 / -1; font-size: 12px; }
.detail .notes div { white-space: pre-wrap; background: var(--mark); padding: 6px 8px; border-radius: 6px; margin-top: 4px; }
.hist ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
.att-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.thumb { position: relative; margin: 0; width: 132px; }
.thumb-btn { padding: 0; width: 132px; height: 96px; overflow: hidden; display: grid; place-items: center; background: var(--na-soft); }
.thumb-btn img { max-width: 100%; max-height: 100%; display: block; }
.thumb-btn img.missing { display: none; }
.thumb figcaption { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.thumb-del { position: absolute; top: 3px; right: 3px; padding: 0 6px; font-size: 12px; line-height: 18px; opacity: .85; }

/* Dialogs */
dialog.box { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); max-width: min(900px, 94vw); width: 100%; }
dialog.box.narrow { max-width: min(560px, 94vw); }
dialog::backdrop { background: rgba(0,0,0,.4); }
.ask h2 { margin-top: 0; }
.ask label { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; font-size: 13px; font-weight: 600; }
.ask .req { color: var(--danger); }
.ask .pick-row { display: flex; flex-wrap: wrap; gap: 4px; font-weight: 400; }
.ask .pick-row button { font-size: 12px; padding: 2px 8px; border-radius: 12px; }
.ask-btns { display: flex; justify-content: flex-end; gap: 8px; margin: 14px 0 0; }
.change-list { margin: 4px 0; padding-left: 18px; max-height: 160px; overflow: auto; }
.log-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.log-table td, .log-table th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
.log-table td.v { max-width: 320px; white-space: pre-wrap; overflow-wrap: anywhere; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);

      "text": "How do the HMS, ResSim and RAS model results compare at identical locations for the same event?"
     },
     {
      "id": "CNF-011",
      "text": "Are cloud-compute runtimes in line with expectations?"
     },
     {
      "id": "CNF-012",
      "text": "Are the hydraulic model errors and iterations within acceptable limits? This includes volume error and water surface elevation error. If large WSE errors exist, are they justified?"
     },
     {
      "id": "CNF-013",
      "text": "Are there signs of model instability? Confirm in both the timeseries view and in RAS Mapper."
     },
     {
      "id": "CNF-014",
      "text": "Check RAS handling of conversion from any period average inputs to inst-val for accuracy and appropriateness."
     }
    ]
   },
   {
    "id": "CNF-S02",
    "title": "Initial States and Hydrologic Parameter Datasets",
    "items": [
     {
      "id": "CNF-015",
      "text": "Do the sampled initial states within the hydrologic model align with the POR observed values?"
     },
     {
      "id": "CNF-016",
      "text": "Have the sampled initial states (drawn from the POR simulation results) within the hydrologic model been verified to fall within acceptable bounds as defined by the historic events?"
     }
    ]
   },
   {
    "id": "CNF-S03",
    "title": "Levee Data",
    "items": [
     {
      "id": "CNF-017",
      "text": "Are any significant portions of the National Levee Database leveed area not included in the AEP grid output that would indicate additional levee breaches are necessary?"
     },
     {
      "id": "CNF-018",
      "text": "Are the incipient overtopping locations in the model output correctly accounted for by LCL (levee control location) breach location(s)? Do adjustments need to be made to account for levee overtopping breaches more accurately?"
     },
     {
      "id": "CNF-019",
      "text": "Are there significant abnormalities in the resultant Annual Probability of Inundation or Annual Probability of Failure compared with input APF and API that cannot be rationalized?"
     },
     {
      "id": "CNF-020",
      "text": "What are the resulting breach widths from the conformance realization? Are they reasonable?"
     },
     {
      "id": "CNF-021",
      "text": "Were any levee alignment and profile data in the hydraulic model adjusted during the conformance phase? If so, is it documented in the conformance phase report? Was it coordinated with the appropriate team members?"
     },
     {
      "id": "CNF-022",
      "text": "Were any levee breach parameter data or system response data adjusted during the conformance phase? If so, is it documented in the conformance phase report? Was it coordinated with the appropriate team members?"
     },
     {
      "id": "CNF-023",
      "text": "Are levee breaches being triggered as expected? For example, are breaches being triggered by interior leveed-area inundation? Are breaches being triggered by rainfall induced inundation?"
     }
    ]
   },
   {
    "id": "CNF-S07",
    "title": "Hydraulic Event Filtering",
    "items": [
     {
      "id": "CNF-025",
      "text": "Were the hydraulic events filtered appropriately?"
     }
    ]
   },
   {
    "id": "CNF-S04",
    "title": "Consequences",
    "items": [
     {
      "id": "CNF-026",
      "text": "Was a comparison between calibration and conformance conducted? Were the issues identified in calibration phase addressed (re-confirm)?"
     },
     {
      "id": "CNF-027",
      "text": "Were conformance phase frequency outputs at structures investigated by the consequence team member? Were any issues conveyed to hydraulic and risk team members?"
     },
     {
      "id": "CNF-028",
      "text": "Are any lingering issues and limitations adequately described in the report?"
     },
     {
      "id": "CNF-029",
      "text": "Was an evaluation of consequence results behind levees completed in collaboration with the levee data lead? Were all remaining issues regarding hydraulic model, levee fragility or structure placements addressed?"
     },
     {
      "id": "CNF-030",
      "text": "Is it clear which damage functions are being applied for the project? Is it documented? Are the source functions posted and transparent in the model library?"
     },
     {
      "id": "CNF-031",
      "text": "Written report is complete and uploaded to model library?"
     }
    ]
   },
   {
    "id": "CNF-S05",
    "title": "Conformance Evaluation",
    "items": [
     {
      "id": "CNF-032",
      "text": "Have all required conformance evaluation graphics been produced and shared?"
     },
     {
      "id": "CNF-033",
      "text": "Have all required conformance metrics been evaluated?"
     },
     {
      "id": "CNF-034",
      "text": "Are simulated damages for relatively frequent events appropriate? Do large damages for frequent events indicate a hydraulic modeling issue or a structure placement issue?"
     },
     {
      "id": "CNF-035",
      "text": "Is there adequate discussion in the report regarding the conformance of the model results?"
     },
     {
      "id": "CNF-036",
      "text": "Are the results of the conformance phase adequate to promote the project with the existing watershed model to the production phase?"
     },
     {
      "id": "CNF-037",
      "text": "Have the compute costs for the production phase been estimated?"
     },
     {
      "id": "CNF-038",
      "text": "Have all required metrics been calculated?"
     },
     {
      "id": "CNF-039",
      "text": "Have plots comparing modeled vs. observed data been provided?"
     },
     {
      "id": "CNF-040",
      "text": "Has an initial comparison been made to the stage and flow frequency curves?"
     },
     {
      "id": "CNF-041",
      "text": "Has an initial analysis of error metrics in hydraulics been performed? These include: percent of simulations failed/unstable, volume error, runtime, WSE error, comparison with published rating curves, etc. Do any of these metrics merit additional modifications to the modeling?"
     },
     {
      "id": "CNF-042",
      "text": "After a conformance realization has been completed, reverify all items listed in the \"Initial Cloud Compute\" section at the beginning of this checklist meet requirements."
     },
     {
      "id": "CNF-043",
      "text": "Does the sampled set of storms match the storm catalog in terms of seasonality & storm type?"
     },
     {
      "id": "CNF-044",
      "text": "Do all sampled storm centers fall within the transposition domain?"
     }
    ]
   },
   {
    "id": "CNF-S06",
    "title": "Documentation",
    "items": [
     {
      "id": "CNF-045",
      "text": "Have all aspects of the conformance phase efforts been fully documented in the conformance report?"
     }
    ]
   }
  ]
 },

  "sections": [
   {
    "id": "RAS-S01",
    "title": "Project Setup - General",
    "items": [
     {
      "id": "RAS-001",
      "text": "What version of HEC-RAS was used to run the model? Does it match the version called out in the Project Work Plan?"
     },
     {
      "id": "RAS-002",
      "text": "Has the overview model description been included on the description tab on the main HEC-RAS menu (including all requirements specified in the SOP)?"
     },
     {
      "id": "RAS-003",
      "text": "Is the RAS model in the correct units (US foot)?"
     },
     {
      "id": "RAS-004",
      "text": "Are all time series inputs in the GMT time zone?"
     },
     {
      "id": "RAS-005",
      "text": "Have the appropriate naming conventions been followed? This includes the Project Name as well as the geometries, plans and flow files (see SOP for naming conventions)."
     },
     {
      "id": "RAS-006",
      "text": "Does the model include specified scenarios for calibration and validation of model parameters?"
     },
     {
      "id": "RAS-007",
      "text": "Verify that the shapefiles and DEMs are in the correct projection. (see SOP for details on projection)"
     },
     {
      "id": "RAS-008",
      "text": "Have excess RAS files (geometries, plans, flow files, etc.) that weren't used or could be consolidated been removed?"
     },
     {
      "id": "RAS-009",
      "text": "Have excess RAS output files (.DSS, .rxx, .Oxx, etc.) that relate to deleted plans been removed?"
     }
    ]
   },
   {
    "id": "RAS-S02",
    "title": "Terrain",
    "items": [
     {
      "id": "RAS-010",
      "text": "Is the DEM adequate to produce an effective model? Overall, are there problem areas in the DEM that could significantly alter the modeling results?"
     },
     {
      "id": "RAS-011",
      "text": "Is the DEM in the correct vertical datum?"
     },
     {
      "id": "RAS-012",
      "text": "Are there areas where levees and/or roads need to be better defined in the DEM which are not included in the NLD? Hydraulic controls such as high ground must be adequately represented in the terrain."
     },
     {
      "id": "RAS-013",
      "text": "Does the DEM provide adequate coverage to provide sufficient mapping?"
     },
     {
      "id": "RAS-014",
      "text": "Does the DEM represent bare-earth?"
     },
     {
      "id": "RAS-015",
      "text": "Was the official version of the DEM provided used for model development? (central DEMs are produced during scoping phase and posted to 'terrain-base' directory)"
     },
     {
      "id": "RAS-016",
      "text": "Is the DEM quality acceptable? Have topographic abnormalities been corrected?"
     },
     {
      "id": "RAS-017",
      "text": "Are the vertical and horizontal distances in the same unit (ft)?"
     },
     {
      "id": "RAS-018",
      "text": "Does the terrain cover the entire 2D study area?"
     },
     {
      "id": "RAS-019",
      "text": "If multiple topo sources used, are all terrains projected in the correct coordinate system? Were vertical datum adjustments required and documented? Do the different terrain sources tie into one another well?"
     },
     {
      "id": "RAS-020",
      "text": "What is the source of channel bathymetry? Is the bathymetry correctly added to terrain and does it seem reasonable at transitions, if applicable?"
     },
     {
      "id": "RAS-021",
      "text": "Are terrain modifications used and applied correctly to locally correct terrain? Are bridges and culverts represented with terrain modifications where appropriate? Has reservoir bathymetry been added using terrain modifications, and if so, is it reasonable?"
     },
     {
      "id": "RAS-022",
      "text": "Has the modeling terrain been uploaded to the correct location on Model Library (\"terrain-modeling\" folder)? This includes all .tif files, .vrt, and .hdf file (which must include vector terrain modifications)."
     },
     {
      "id": "RAS-023",
      "text": "Has the terrain been resampled to a single raster dataset at a coarser resolution and uploaded to the correct location on the model library (\"terrain-mapping\" folder)?"
     }
    ]
   },
   {
    "id": "RAS-S03",
    "title": "Mesh Geometry",
    "items": [
     {
      "id": "RAS-024",
      "text": "Does the 2D model domain (i.e. perimeter) agree with the watershed boundary indicated by the terrain DEM? Are there areas where culverts, bridges, canals, or other features modify the watershed boundary which are not captured by the 2D model domain? (The 2D domain was likely generated from a coarser resolution DEM and therefore there may be disagreement between watershed boundaries generated from this DEM and the higher-resolution modeling terrain.)"
     },
     {
      "id": "RAS-025",
      "text": "Is the appropriate project projection referenced by the model geometry? Was reprojection required and is it adequately documented?"
     },
     {
      "id": "RAS-026",
      "text": "Is the model domain delineated properly to capture all contributing flows through rain-on-grid or external hydrograph?"
     },
     {
      "id": "RAS-027",
      "text": "What nominal cell resolution was used and is it consistent with the SOP? Is it appropriately sized to limit cell count while obtaining reasonable results and runtimes?"
     },
     {
      "id": "RAS-028",
      "text": "Have sufficient break lines been delineated and added to the 2D mesh to define topographic restraints such as hydrologic divides (ridgelines), roads, railroads, dams, levees, diversions, and natural high ground areas? Break lines should be used to ensure all relevant barriers to flow are represented in the model. Break lines must be enforced properly to ensure cell faces snap to break lines. Particular attention is required wherever break lines cross or become close enough such that their enforcement conflicts with one another. Manual editing to the 2D cell points may be required for cell faces to snap to breaklines."
     },
     {
      "id": "RAS-029",
      "text": "Are Key and Secondary streams appropriately meshed with breaklines and cell alignment? Are levee-like features along the rivers' banks defined by breaklines and respected by the 2D cell mesh to properly represent overbanking flows? Are 2D cells generally aligned with the flow direction? (https://www.hec.usace.army.mil/confluence/rasdocs/hgt/latest/guides/aligning-cell-faces-in-channels-with-refinement-regions)"
     },
     {
      "id": "RAS-030",
      "text": "Have break line cell size, near repeats, and enforcement been appropriately applied to capture topographic restraints and local hydraulics?"
     },
     {
      "id": "RAS-031",
      "text": "Has manual hand-editing of 2D cell points taken place to ensure 2D cell faces respect high ground and hydraulic controls? If hand-editing has not been performed, is mesh quality sufficient?"
     },
     {
      "id": "RAS-032",
      "text": "Does the mesh include appropriate detail as called for in the SOP in the \"Background Mesh Areas\", \"Urban Areas\", \"Key Streams (including floodplains)\", and \"Secondary Streams\"?"
     },
     {
      "id": "RAS-033",
      "text": "Have refinement regions been used and are they appropriately located? (channel banks, developed areas, etc.) Have decisions about refinement regions been appropriately documented and follow the SOP guidelines? If used to define a channel does the refinement region boundary capture adjacent hydraulic control (top of bank)?"
     },
     {
      "id": "RAS-034",
      "text": "Are refinement region cell sizes and enforcement appropriate for the intended purpose (balancing hydraulic detail and computation time)? Do they adequately describe the water surface slope and potential changes in water surface slope (i.e., is enough detail being captured by a reduced cell size)? Even within refinement regions, breaklines may be required to ensure hydraulic controls such as high ground and channel constrictions are respected by the 2D mesh."
     },
     {
      "id": "RAS-035",
      "text": "Is the overall inundation quality acceptable? Can finer 2D cells improve the results? Ensure an appropriate RAS Mapper rendering mode is used to yield the best mapping results. (see SOP for recommendations)"
     },
     {
      "id": "RAS-036",
      "text": "Are terrain modifications utilized to allow flow to pass mesh-enforced high ground/embankments where openings exist? Does the width of the terrain modification reasonably coincide with the opening of the structure (bridge/culvert)? (Check last timestep of model to see if there is excess back up of water anywhere.)"
     },
     {
      "id": "RAS-037",
      "text": "Are there any other major features in the basin that affect characteristics of flooding? Are they adequately accounted for in the model construction? (e.g. bridges, gated weirs, stormwater ponding areas, pump stations, ground water recharge areas, low-head dams, etc.)"
     },
     {
      "id": "RAS-038",
      "text": "If hydraulic structures are modeled (bridges, weirs, gates, pumps, etc.) are they modeled appropriately? Are modeled geometries and operational parameters consistent with source data (as-builts, survey, O&M manuals, etc.)?"
     },
     {
      "id": "RAS-039",
      "text": "Is the source for hydraulic roughness values documented and reasonable? (NLCD, image based delineation, etc.) Are the base n-value assignments appropriate? Are stream channel areas for Key and Secondary streams well defined from a roughness perspective?"
     },
     {
      "id": "RAS-040",
      "text": "Has a roughness coefficient been assigned to each cell? Is the assignment of roughness to each cell face reasonable (spot check select cells, with focus on cells referencing calibration regions)? 'Spatially Varied Manning's on Faces' is recommended as default. If this option is not selected, are alternative methods (e.g. blurring) reasonably representative?"
     },
     {
      "id": "RAS-041",
      "text": "If global override or calibration regions are used to modify the base roughness values, are they reasonably appropriate for local conditions?"
     },
     {
      "id": "RAS-042",
      "text": "Are the terrain and land cover files correctly associated to the geometry and results layers?"
     }
    ]
   },
   {
    "id": "RAS-S04",
    "title": "Dams Geometry and Breaches",
    "items": [
     {
      "id": "RAS-043",
      "text": "Does the model account for flow-regulating dams as specified in the Dam Scoping Table? Were they appropriately modeled? Modeling of dams varies depending on the scope specified for each structure."
     },
     {
      "id": "RAS-044",
      "text": "Do reservoirs include bathymetry appropriate for their type based on the Dam Scoping Table? Does the elevation-storage represented by the terrain bathymetry match the best available information? Is the elevation-storage relationship consistent between RAS, ResSim, and HMS models?"
     },
     {
      "id": "RAS-045",
      "text": "Do reservoirs contain appropriate outlets as defined in the Dam Scoping Table? (e.g. timeseries of releases, elevation-discharge rating curve, etc.)"
     },
     {
      "id": "RAS-046",
      "text": "Do reservoirs have breaches modeled per the Dam Scoping Table? Are breach locations and parameters appropriate? Have these breach parameters been coordinated with the Dam Data lead?"
     },
     {
      "id": "RAS-047",
      "text": "Are there any dams present in the model which are not included in the Dam Scoping Table? Are these dams modeled appropriately? Do any of these dams merit additional coordination with the Model Team Lead or HMS/ResSim modelers?"
     },
     {
      "id": "RAS-048",
      "text": "Where appropriate, do reservoirs include a small notch to simulate a low-level outlet according to the Dam Scoping Table? Is the invert elevation of this notch appropriate?"
     },
     {
      "id": "RAS-049",
      "text": "Do reservoirs with bathymetric data include initial conditions (IC) points to specify the starting pool elevation (following SOP guidance)?"
     },
     {
      "id": "RAS-050",
      "text": "Do the system response curve elevation ranges match the dam toe and crest elevations documented in the breach location attribute table?"
     },
     {
      "id": "RAS-051",
      "text": "Is the terrain above the dam adequate to support breaches with the selected invert? Also adequate to support all possible sampled starting pool elevations?"
     },
     {
      "id": "RAS-052",
      "text": "For dams where a timeseries of releases is specified, 'GIS centerline coordinates' should be specified to define precisely where flow is taken from and transferred to. The upstream end of this centerline should connect to a relatively large 2D cell within the reservoir so that adequate volume is available to be extracted from that cell during a single timestep even when large releases are called for. Small cells connected to a structure with large releases can result in model stability problems."
     },
     {
      "id": "RAS-053",
      "text": "Is the 2D mesh appropriately representing the damming surface of the dam embankment? Do 2D cell faces snap perfectly to SA/2D connection structures? Can flows 'leak' through the embankment at high pools due to poor 2D cell meshing?"
     }
    ]
   },
   {
    "id": "RAS-S05",
    "title": "Levees Geometry & Breaches",
    "items": [
     {
      "id": "RAS-054",
      "text": "Were Levees in the basin appropriately modeled? Is the Crest Elevation Profile consistent with the NLD? Are there any inaccurate low-spots in crest profile within the model? Levee closure locations and road/railroad crossings should be examined to ensure the levee crest is appropriately modeled."
     },
     {
      "id": "RAS-055",
      "text": "Does the NLD crest information agree with the terrain indicated crest? If not, have these areas been examined and explained? Is the modeled crest profile appropriate? Is the levee centerline alignment appropriate?"
     },
     {
      "id": "RAS-056",
      "text": "Was the breach location consistent with the data provided from risk evaluations?"
     },
     {
      "id": "RAS-057",
      "text": "Are the breach parameters consistent with the current SOP guidance for breach invert, breach mode, formation time? Were these breach parameters coordinated with the Levee Data Lead?"
     },
     {
      "id": "RAS-058",
      "text": "Were levee breach scenarios developed and computed as part of the stress testing?"
     },
     {
      "id": "RAS-059",
      "text": "Did the breach inputs from the simplified physical method produce reasonable parameters during the stress testing?"
     },
     {
      "id": "RAS-060",
      "text": "Are levee interior drainage system features included in the model appropriately? This includes gravity drain culverts (with or without flap gates), pump stations, ponding areas, etc."
     },
     {
      "id": "RAS-061",
      "text": "Do the system response curve elevation ranges match the levee toe and crest elevations documented in the breach location attribute table?"
     },
     {
      "id": "RAS-062",
      "text": "Is the 2D mesh appropriately representing the damming surface of the levee embankment? Do 2D cell faces snap perfectly to SA/2D connection structures? Can flows 'leak' through the embankment at high pools due to poor 2D cell meshing?"
     },
     {
      "id": "RAS-063",
      "text": "Was a simulation performed to induce overtopping of levees and identify a levee control location (LCL)? This should be done in addition to stress testing with breaches."
     }
    ]
   },
   {
    "id": "RAS-S06",
    "title": "Event Selection & Boundary Conditions",
    "items": [
     {
      "id": "RAS-064",
      "text": "Are the storm events used for calibration documented and consistent with selected calibration events from the scoping effort? Were all calibration/validation events run?"
     },
     {
      "id": "RAS-065",
      "text": "Are boundary conditions data sources, such as inflow, baseflow, and precipitation .dss files, accurately linked? Confirm that unsteady baseflow values are not hardcoded. Was a minimum flow or multiplier assigned to baseflows?"
     },
     {
      "id": "RAS-066",
      "text": "Are any observed datasets used at boundary conditions? And if so, have they been appropriately adjusted from period-average values to instantaneous flow values to preserve the period average information when converted to instantaneous values?"
     },
     {
      "id": "RAS-067",
      "text": "Are Base Flow boundaries laid out consistent with the HEC-HMS model boundaries and accumulation locations?"
     },
     {
      "id": "RAS-068",
      "text": "Are boundary condition lines appropriately assigned to reasonably distribute flow?"
     },
     {
      "id": "RAS-069",
      "text": "Is the downstream boundary condition appropriate? Does it yield unreasonable results within one floodplain width of the boundary? A stage-discharge rating curve informed by model results from the next downstream model unit may be appropriate/required to capture backwater effects. Extending the 2D model domain downstream to overlap with adjacent model unit areas may be required to improve boundary condition representation."
     },
     {
      "id": "RAS-070",
      "text": "Were the hydraulic model results at interfaces between hydraulic model units checked for reasonableness? This may include areas where model extents were extended downstream so results in the study area are not impacted by the estimated downstream boundary condition."
     },
     {
      "id": "RAS-071",
      "text": "Are there areas where water pools against the model boundary? Do these areas require additional boundary conditions to remove flow from model unit? If so, does this outflow need to be coordinated with adjacent model units so they can appropriately receive flow?"
     }
    ]
   },
   {
    "id": "RAS-S07",
    "title": "Model Stability / Runtime / Calculation Options",
    "items": [
     {
      "id": "RAS-072",
      "text": "Is the timestep appropriate for the mesh size and calculated velocities (are the associated Courant numbers reasonable)? Could these be modified to yield more efficient computation times without sacrificing quality/accuracy?"
     },
     {
      "id": "RAS-073",
      "text": "Is \"Advanced Time Step Control\" used to adjust the Computation Time Step? Maximum Courant for Diffusion Wave should be 3.0 and for SWE should be 2.0."
     },
     {
      "id": "RAS-074",
      "text": "Are any Restart Files or initial conditions being used to 'wet start' or 'warmup' the model? If so, are they justified and appropriate? Restart files are not preferred."
     },
     {
      "id": "RAS-075",
      "text": "Does volume accounting in the output (BCO files-Computation log file) show acceptable results? Typically this should be well less than 1%; however, there can be instances with small non-contributing areas with large percent errors due to the small inflows. Percent error values greater than 3% indicate that there are major problems with the model."
     },
     {
      "id": "RAS-076",
      "text": "Are the plan file Calculation Options and Tolerances set to default values? If not, what changes were made?"
     },
     {
      "id": "RAS-077",
      "text": "What 2D equation set was used and is it appropriate? Was a sensitivity analysis done on the 2D equation sets and if so, was there a significant difference? If so, the Full Momentum should be considered more accurate? Examples of when Full Momentum should be considered include highly dynamic flood waves (i.e. flood wave rises and falls extremely quickly), abrupt contractions and expansions, tidally influenced conditions, wave propagation modeling, super elevation around bends, etc."
     },
     {
      "id": "RAS-078",
      "text": "Are both the \"hydrograph output interval\" and \"mapping output interval\" set at a reasonable interval to capture peak flows within the model? Both should be set the same and are generally set to 1 hour for use in calibration statistics."
     },
     {
      "id": "RAS-079",
      "text": "Are there any red flags for model stability? (maximum water surface error, extreme velocities, extreme and/or rapid changes in WSE, unstable SA/2D and/or BC hydrographs, etc.). Inundation should be animated and examined in RAS Mapper for signs of instability. Are there oscillations in WSE or velocity that are associated with instability? Ensure that the output timestep is not inadvertently hiding these oscillations through aliasing."
     },
     {
      "id": "RAS-080",
      "text": "Are all water-surface elevation convergence warning messages acceptable per computation tolerances? (<0.2 ft and converging)"
     },
     {
      "id": "RAS-081",
      "text": "Are any of the computed/mapped maximum depth, WSEL, and velocity values from numerical surge at the beginning of model? Have instances of model instabilities at the beginning of the simulation due to initial wetting of a dry grid been addressed?"
     },
     {
      "id": "RAS-082",
      "text": "Does the overall runtime for each scenario meet the FFRD standard? Are there obvious ways to reduce computational runtime without sacrificing model accuracy? (e.g. increase computational interval, increase cell size within refinement regions or along break lines,...) Would a sacrifice in model accuracy be acceptable, either locally or globally?"
     },
     {
      "id": "RAS-083",
      "text": "Can the \"computation log file\" and \"runtime messages\" be seen for each plan? Do these files indicate outstanding issues with the model?"
     },
     {
      "id": "RAS-084",
      "text": "Have internal connections been enforced as break lines into the 2D mesh? Areas where break lines intersect or come near 2D structures should be inspected to ensure 2D cell faces are snapped to the structure centerline."
     },
     {
      "id": "RAS-085",
      "text": "Internal Connection: Has an appropriate overflow computation method been selected (2D equation or weir equation)? If the weir equation has been selected is the weir coefficient of discharge reasonable? https://www.hec.usace.army.mil/confluence/rasdocs/hgt/latest/guides/modeling-weirs-in-2d-areas"
     },
     {
      "id": "RAS-086",
      "text": "Were efforts made to optimize runtime and reduce model iteration? Cells which experience excessive iteration during runtime should be investigated. Often times cells with very steep elevation-volume property tables cause excessive iteration and these cells' alignment can be modified to improve stability."
     },
     {
      "id": "RAS-087",
      "text": "Have stress tests been performed to evaluate model stability robustness and breach performance? If so, were they acceptable? This is for both dam and levee breaches."
     },
     {
      "id": "RAS-088",
      "text": "Are any additional output options enabled to be written with results? These would be selected in the \"Plan > Options > Output Options …\" window. Enabling these options can be useful for troubleshooting model issues, but can result in significantly increased file sizes and these should be disabled prior to the conformance phase of hydraulic model simulation."
     }
    ]
   },
   {
    "id": "RAS-S08",
    "title": "Calibration & Goodness of Fit",
    "items": [
     {
      "id": "RAS-089",
      "text": "Have reference lines and reference points been appropriately included in the model as described by the SOP? Are naming conventions met? Reference points are required at several locations near levees and also at gage locations (refer to SOP)."
     },
     {
      "id": "RAS-090",
      "text": "Are reference lines enforced with a breakline such that the reference line falls along 2D cell faces? Reference lines should not be placed on top of SA/2D connections as they will not capture flow passed through these connections, rather they should be placed US or DS over 2D cell faces."
     },
     {
      "id": "RAS-091",
      "text": "Do reference lines span the full floodplain width such that flows will not flank around the reference line even during extreme floods and dam breaches? If the flow area captured by a reference line differs from flow area captured by USGS measurements, are these instances and discrepancies documented?"
     },
     {
      "id": "RAS-092",
      "text": "Are reference points placed within a deep portion of the stream channel? Placement of reference points will likely not correspond to the exact latitude/longitude points reported by the USGS."
     },
     {
      "id": "RAS-093",
      "text": "Have model results been compared to elevation-discharge rating curves for goodness of fit? Is the comparison acceptable?"
     },
     {
      "id": "RAS-094",
      "text": "Have the mapping results from the calibration events been evaluated using the National Structure Inventory structure placements? Are any structures experiencing significant depths for non-flood flows? Do these results indicate an issue with the terrain or hydraulic model?"
     },
     {
      "id": "RAS-095",
      "text": "Is the method for model calibration documented and appropriate? Was documentation provided (calibration spreadsheet)? Was the calibration evaluated based on the standard set of metrics defined in the FFRD Draft guidance?"
     },
     {
      "id": "RAS-096",
      "text": "Did the model simulation start and end times conform to the standard time window? Does this window cover the entire event period?"
     },
     {
      "id": "RAS-097",
      "text": "Did the Primary Gages reach 'Satisfactory' or better for flow & stage for all calibration events? If not, is there hydraulic justification?"
     },
     {
      "id": "RAS-098",
      "text": "Did the Secondary Gages reach 'Satisfactory' or better for flow & stage for all calibration events? If not, is there hydraulic justification?"
     },
     {
      "id": "RAS-099",
      "text": "Did the Tertiary Gages reach 'Satisfactory' or better for flow & stage for all calibration events? If not, is there hydraulic justification?"
     },
     {
      "id": "RAS-100",
      "text": "Are the modeled flood depths, water surface elevations and velocities in the reasonable range and make sense? Does the mapped floodplain look reasonable? If possible, compare the mapped floodplain with the original 2D BLE floodplain; if there are major areas of discrepancy, try to determine if mesh refinement or additional break lines may be warranted. Note that the original 2D BLE floodplain may not necessarily be \"correct.\""
     },
     {
      "id": "RAS-101",
      "text": "Are there any areas with long ponding durations? If yes, have they been evaluated, documented, and adjusted to address areas where ponding was unintended or could negatively influence results, locally and downstream?"
     },
     {
      "id": "RAS-102",
      "text": "Are the stage and flow hydrographs at key locations reasonable?"
     },
     {
      "id": "RAS-103",
      "text": "Have observed data been entered at gage locations and associated with reference points/lines? Entering published stage-discharge relationships and associating these data with a reference line is highly recommended for comparison of model results with published data."
     }
    ]
   },
   {
    "id": "RAS-S09",
    "title": "FFRD Standardization & Documentation & Delivery",
    "items": [
     {
      "id": "RAS-104",
      "text": "What RAS model version was used for the model? Is it clearly documented and does it match the version specified during the Scoping Phase?"
     },
     {
      "id": "RAS-105",
      "text": "Are all of the files in the model correctly linked? Any broken links?"
     },
     {
      "id": "RAS-106",
      "text": "Naming Conventions: Do the RAS model files follow the FFRD guidance for standardization?"
     },
     {
      "id": "RAS-107",
      "text": "Are there any extraneous/unused/unnecessary files saved with the project? Does the output DSS file include additional information for un-used or out-of-date runs? Has the model and its directory been cleaned of all extraneous files and \"working\" data, such as previous geometry iterations, unused plans, and extraneous flow files, etc.? For models with large file sizes has the \"PostProcessing.hdf\" file been removed from each map folder within the RAS model? Have all temporary and interim project files been deleted from the model? Have all unused output files been deleted from the project directory?"
     },
     {
      "id": "RAS-108",
      "text": "Does the written documentation of this model sufficiently support the modeling effort? Is the report content in a \"final\" state and ready for editor review & publishing? Does the report document calibration efforts and any unique modeling scenarios dealt with during model development? Are outstanding model limitations and assumptions well documented?"
     },
     {
      "id": "RAS-109",
      "text": "Does the model report clearly show a map of the model extent and the study extent and clarify if they are different?"
     },
     {
      "id": "RAS-110",
      "text": "Are there any specific pieces of technical information that were noted as missing from the report? Please provide any substantive or editorial comments for the provided report directly in the report document review/comment area."
     },
     {
      "id": "RAS-111",
      "text": "Has all model data, support data and report been uploaded to the Model Library for review?"
     },
     {
      "id": "RAS-112",
      "text": "Are all required saved output locations at reference points and reference lines included in the model? Do they follow the standard naming conventions?"
     }
    ]
   },
   {
    "id": "RAS-S10",
    "title": "Consequences Review of Hydraulic Results",
    "items": [
     {
      "id": "RAS-113",
      "text": "Was the structure inventory developed during the data preparation phase utilized to aid in hydraulic model development?"
     },
     {
      "id": "RAS-114",
      "text": "Were the consequences team members alerted that the hydraulic model has been submitted for review?"
     },
     {
      "id": "RAS-115",
      "text": "Was the consequences team review performed using the consequences checklist? Have any comments related to the hydraulic model been addressed?"
     }
    ]
   }
  ]
 },

   {
    "id": "HMSC-S01",
    "title": "HEC-HMS Continuous Simulation",
    "items": [
     {
      "id": "HMSC-001",
      "text": "How were basin and meteorological model processes and parameters chosen for use within the continuous simulations? Were these processes the same as those that were used within the historical event simulations? Were these parameters chosen using the historical event simulations?"
     },
     {
      "id": "HMSC-002",
      "text": "Were any basin element changes made within the continuous simulation model? Were these changes documented in the report and explained?"
     },
     {
      "id": "HMSC-003",
      "text": "For each subbasin, is the Maximum Canopy Storage parameter value within the continuous simulations greater than the minimum Maximum Canopy Storage parameter value of any historic event? This should be avoided in order to avert potential sampling problems w/in the conformance and production phases."
     },
     {
      "id": "HMSC-004",
      "text": "For each subbasin, is the Maximum Deficit parameter value within the continuous simulations greater than the minimum Maximum Deficit parameter value of any historic event? This should be avoided in order to avert potential sampling problems w/in the conformance and production phases."
     },
     {
      "id": "HMSC-005",
      "text": "Are the same paired data objects (e.g., storage-discharge, elevation-storage, etc.) used within both the historic event and continuous simulations? The same paired data objects should be used in order to avoid generating possibly erroneous state variables during the conformance and production phases."
     },
     {
      "id": "HMSC-006",
      "text": "Was a shorter continuous simulation performed to evaluate model performance (ET, SWE, discharge) with selected parameters prior to the full continuous simulation time period?"
     },
     {
      "id": "HMSC-007",
      "text": "Does the shorter continuous model compute without any errors?"
     },
     {
      "id": "HMSC-008",
      "text": "Do computed results meet or exceed the performance metrics (i.e. Satisfactory or higher at Primary and Secondary Locations) for all events as specified within the SOP? Do flow and/or stage hydrographs reasonably match the timing, magnitude, and shape of historic peak flows or as defined in the SOP?"
     },
     {
      "id": "HMSC-009",
      "text": "If the time step of observed data was significantly larger than the computational time interval (e.g., daily average observed data vs. 1-hour computed data), how were statistical metrics computed at Primary, Secondary, and Tertiary gage locations?"
     },
     {
      "id": "HMSC-010",
      "text": "Does the full period of record HMS model simulate successfully?"
     },
     {
      "id": "HMSC-011",
      "text": "Were multiple summarizations (monthly average volume, annual peak flow, flow duration etc.) used to compare the full period of record simulated results?"
     },
     {
      "id": "HMSC-012",
      "text": "Were the simulated annual and monthly averaged SWE and PET values checked against other sources?"
     },
     {
      "id": "HMSC-013",
      "text": "Does the report describe any potential model bias (i.e. parts of the watershed where the model tends to over/under-predict in peak flows and/or volumes)?"
     },
     {
      "id": "HMSC-014",
      "text": "Were extraneous model components (basin models, meteorologic models, control specifications, etc.) removed from the final HMS project?"
     },
     {
      "id": "HMSC-015",
      "text": "Was documentation of the POR calibration milestone provided to the reviewer?"
     }
    ]

   {

   }
  ],
  "sections": [
   {
    "id": "HMSE-S01",
    "title": "Model Construction",
    "items": [
     {
      "id": "HMSE-001",
      "text": "What version of HEC-HMS was used to run the model? Does it match the version called out in the Project Work Plan (BE-PWP)?"
     },
     {
      "id": "HMSE-002",
      "text": "What was the source of the terrain data used for subbasin delineation? (LiDAR, NED, CWMS, etc.)"
     },
     {
      "id": "HMSE-003",
      "text": "What was the cell size of the final DEM? Was the data resampled from the original dataset(s)?"
     },
     {
      "id": "HMSE-004",
      "text": "Does the DEM cover the entire extent of the watershed?"
     },
     {
      "id": "HMSE-005",
      "text": "Is the DEM in the standard MMC projection (Albers Equal Area feet) and vertical datum (NAVD 88)?"
     },
     {
      "id": "HMSE-006",
      "text": "Were the GIS tools within HEC-HMS used to delineate subbasins, routing reaches, and junctions?"
     },
     {
      "id": "HMSE-007",
      "text": "Was the team/district approved stream centerline burned into the terrain and used during basin model delineation?"
     },
     {
      "id": "HMSE-008",
      "text": "Were team/district approved polygons used as walls to aid during basin model delineation?"
     },
     {
      "id": "HMSE-009",
      "text": "Are subbasins delineated at all Primary, Secondary, and Tertiary stream gages within the watershed?"
     },
     {
      "id": "HMSE-010",
      "text": "Do subbasin extents closely match published watershed delineations (USGS HUCs and/or NWS basins)? Are there discrepancies between USGS HUC and/or NWS basins and have they been investigated?"
     },
     {
      "id": "HMSE-011",
      "text": "Is the size and number of subbasins and routing reaches adequate for stochastic/Monte Carlo application? (Keep in mind the computational burden to simulate the model hundreds of thousands of times. Too many subbasins will generate additional outputs and slow down the Monte Carlo process.)"
     },
     {
      "id": "HMSE-012",
      "text": "Were reservoir elements used to simulate the translation/attenuation processes within impactful water resources projects? Were sinks/sources used at any reservoirs?"
     },
     {
      "id": "HMSE-013",
      "text": "Does the Elevation-Storage relationship for each reservoir match the best available information? Was any vertical datum adjustment made? Was the Elevation-Storage relationship used in HMS verified for consistency with ResSim and RAS models?"
     },
     {
      "id": "HMSE-014",
      "text": "Does the basin model delineation provide boundary conditions at all locations necessary for the ResSim and RAS models to run?"
     },
     {
      "id": "HMSE-015",
      "text": "Were all basin elements (i.e., subbasins, reservoirs, junctions, etc.) named in accordance with the SOP and in coordination with the rest of the team/district (This should be checked and confirmed even if modeler is using an existing CWMS model)?"
     },
     {
      "id": "HMSE-016",
      "text": "For models using an older CWMS HMS project with a Grid Cell file, was the HMS project updated to use Structured Discretization?"
     }
    ]
   },
   {
    "id": "HMSE-S02",
    "title": "Setup, Process Selection, and Parameterization",
    "items": [
     {
      "id": "HMSE-017",
      "text": "Do all basin models use the FFRD projection as stated in the SOP?"
     },
     {
      "id": "HMSE-018",
      "text": "Were all basin elements properly connected? Was the hydrologic order reviewed and approved by the team?"
     },
     {
      "id": "HMSE-019",
      "text": "Were appropriate modeling processes selected for each subbasin in accordance with the SOP (i.e., Structured Discretization, Simple Canopy, Gridded Temperature Index Snow, Deficit and Constant Loss, Modified Clark Transform, and Linear Reservoir Baseflow)? If not, has adequate justification been provided and vetted by the Hydrologic Engineering Center?"
     },
     {
      "id": "HMSE-020",
      "text": "Were appropriate modeling processes selected for each routing reach in accordance with the SOP (i.e., Muskingum, Modified Puls, and/or Muskingum-Cunge)? If not, has adequate justification been provided and vetted by the Hydrologic Engineering Center?"
     },
     {
      "id": "HMSE-021",
      "text": "Were appropriate modeling processes selected for each reservoir in accordance with the SOP (i.e., Specified Release, etc.)? If not, has adequate justification been provided and vetted by the Hydrologic Engineering Center?"
     },
     {
      "id": "HMSE-022",
      "text": "Was an appropriate potential evapotranspiration method selected within the meteorologic model in accordance with the SOP (i.e., Gridded Hamon)? If not, has adequate justification been provided and vetted by the Hydrologic Engineering Center?"
     },
     {
      "id": "HMSE-023",
      "text": "How were initial model parameters (percent impervious, constant loss rate, time of concentration, etc.) estimated for each subbasin? For existing HMS CWMS models, were \"final\" calibrated basin parameters used?"
     },
     {
      "id": "HMSE-024",
      "text": "If simulating snow accumulation/melt, how were initial snow state variables (e.g., SWE, cold content, etc.) estimated and specified for each subbasin?"
     },
     {
      "id": "HMSE-025",
      "text": "Was an appropriate computational time step (e.g., 15 min < x < 3 hours) selected within all Control Specifications in accordance with the SOP?"
     },
     {
      "id": "HMSE-026",
      "text": "Using one of the calibration events, does the HMS model simulate completely without any major issues?"
     },
     {
      "id": "HMSE-027",
      "text": "Is the HMS project configured so that there are separate basin models for each calibration event? Are there at least 4 calibration events configured?"
     },
     {
      "id": "HMSE-028",
      "text": "Are the time-series data (observed discharge, reservoir elevations, snow water equivalent, etc.) and gridded time-series datasets (Precipitation, Temperature, SWE, PET, etc.) in GMT?"
     },
     {
      "id": "HMSE-029",
      "text": "Have the precipitation and temperature grids been put through a QA/QC process?"
     },
     {
      "id": "HMSE-030",
      "text": "Have the precipitation grids been normalized to better match precipitation volume? If so, was PRISM data or another dataset used when normalizing?"
     },
     {
      "id": "HMSE-031",
      "text": "Has the development of the final gridded precipitation and temperature dataset been documented?"
     },
     {
      "id": "HMSE-032",
      "text": "Have Primary, Secondary, and Tertiary calibration gage locations been clearly defined and documented?"
     },
     {
      "id": "HMSE-033",
      "text": "Have time-series and gridded data been added to the project and have separate meteorologic models been created for each of the calibration events?"
     },
     {
      "id": "HMSE-034",
      "text": "Was observed flow data entered for each gage location using the time-series data manager and linked to the appropriate basin model elements?"
     },
     {
      "id": "HMSE-035",
      "text": "If simulating snow accumulation/melt, was observed SWE data entered using the time-series data manager and linked to the appropriate subbasins?"
     },
     {
      "id": "HMSE-036",
      "text": "Was observed inflow data entered for each reservoir using the time-series data manager and linked to the appropriate basin model elements?"
     },
     {
      "id": "HMSE-037",
      "text": "Was observed reservoir pool elevation entered for each reservoir using the time-series data manager and linked to the appropriate basin model elements?"
     },
     {
      "id": "HMSE-038",
      "text": "For reservoirs using the Specified Release method, has an outflow time-series been added using the time-series data manager and linked to the appropriate basin? If the outflow time series contains missing data, what approach was used to fill in the gaps?"
     },
     {
      "id": "HMSE-039",
      "text": "Have local flows been enabled (set to \"yes\") for each of the basin models?"
     },
     {
      "id": "HMSE-040",
      "text": "Have multiple, reasonable computational time steps been compared and reviewed (e.g., 15-min, 1-hour, and 3-hour)? Have any substantial differences in the computed results due to the computational time step been investigated?"
     },
     {
      "id": "HMSE-041",
      "text": "Does the HMS model run without major errors using the uncalibrated basin model, historic meteorologic model, and control specifications?"
     },
     {
      "id": "HMSE-042",
      "text": "Are the observed flows being read correctly and available in the results plots for the appropriate elements?"
     }
    ]
   },
   {
    "id": "HMSE-S03",
    "title": "Model Calibration",
    "items": [
     {
      "id": "HMSE-043",
      "text": "If simulating snow accumulation/melt, have the calibrated Gridded Temperature Index snow parameters for each subbasin and historical event been checked for reasonableness? Is the specified Ground melt greater than 0 for any subbasin or historical event? Is the wet melt rate less than the dry melt rate or largest ATI-melt rate ordinate for any subbasin or historical event?"
     },
     {
      "id": "HMSE-044",
      "text": "Have the calibrated Simple Canopy parameters for each subbasin and historical event been checked for reasonableness?"
     },
     {
      "id": "HMSE-045",
      "text": "For each subbasin, does the Maximum Canopy Storage parameter vary from one historic event to the other? If so, has an adequate physical justification been provided?"
     },
     {
      "id": "HMSE-046",
      "text": "Have the calibrated Deficit and Constant loss parameters for each subbasin and historical event been checked for reasonableness?"
     },
     {
      "id": "HMSE-047",
      "text": "For each subbasin, does the Maximum Deficit parameter vary from one historic event to the other? If so, has an adequate physical justification been provided?"
     },
     {
      "id": "HMSE-048",
      "text": "For each subbasin, does the Percent Impervious parameter vary from one historic event to the other? If so, has an adequate physical justification been provided?"
     },
     {
      "id": "HMSE-049",
      "text": "Have the calibrated ModClark transform parameters for each subbasin and historical event been checked for reasonableness? Is the calibrated Time of Concentration less than the computational time step for any subbasin? Is the calibrated Watershed Storage Coefficient less than 0.5 * the computational time step for any subbasin?"
     },
     {
      "id": "HMSE-050",
      "text": "Are dimensionless coefficients of the ModClark parameters (i.e., R / [Tc + R]) regionally consistent?"
     },
     {
      "id": "HMSE-051",
      "text": "Have the calibrated Linear Reservoir baseflow parameters for each layer been checked for reasonableness? Are the sums of all partition fractions equal to 1? Is the calibrated GW1 coefficient less than the GW2 coefficient for any subbasin? If using more than 2 layers, is the calibrated GW2 coefficient less than the GW3 coefficient for any subbasin? Are the calibrated GW1, GW2, or GW3 coefficients less than Tc or less than the computational time step for any subbasin? Are the calibrated GW1, GW2, or GW3 coefficients less than R or less than the computational time step for any subbasin?"
     },
     {
      "id": "HMSE-052",
      "text": "Have the calibrated parameters for each routing reach been checked for reasonableness? Do all routing reaches produce outflow hydrographs without major oscillations? If using Modified Puls, have all storage-outflow relationships been extended to avoid errors when simulating events significantly more extreme than the historical events chosen for calibration?"
     },
     {
      "id": "HMSE-053",
      "text": "Was the model calibrated to at least four historical events?"
     },
     {
      "id": "HMSE-054",
      "text": "Do computed results meet or exceed the performance metrics (i.e. Satisfactory or higher at Primary and Secondary Locations) for all events as specified within the SOP? Do flow and/or stage hydrographs reasonably match the timing, magnitude, and shape of historic peak flows or as defined in the SOP?"
     },
     {
      "id": "HMSE-055",
      "text": "Does each historical event simulation complete successfully in under 5 minutes?"
     },
     {
      "id": "HMSE-056",
      "text": "Are calibration parameters realistic given the hydrologic characteristics of the basin? Are parameters consistent across subbasins for hydrologically similar regions? If inconsistencies or unrealistic parameters exist, are they explained and justified in the report?"
     },
     {
      "id": "HMSE-057",
      "text": "Has coordination been conducted with hydraulic modelers to elicit feedback on hydrologic model results? Are modifications needed to hydrologic model to accommodate needs of hydraulic model?"
     }
    ]
   },
   {
    "id": "HMSE-S04",
    "title": "Documentation and Preparation for Continuous / Stochastic Simulations",
    "items": [
     {
      "id": "HMSE-058",
      "text": "Have the pertinent initial state variables for each subbasin, reservoir, and routing reach been changed from relative values to absolute values? Simple Canopy - initial storage must be specified as Depth; Linear Reservoir baseflow - initial discharge for each layer must be specified as discharge; Routing Reaches - Initial Type must be Specified Discharge; Reservoirs - Initial Condition must be Elevation"
     },
     {
      "id": "HMSE-059",
      "text": "Were extraneous model components (basin models, meteorologic models, control specifications, etc.) removed from the final HMS project?"
     },
     {
      "id": "HMSE-060",
      "text": "Was documentation of the historic event calibration milestone provided to the reviewer?"
     }
    ]
   }
  ]
 },
